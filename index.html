direction. European Commission: one commissioner per member state, proposes laws and enforces treaties. The Court of Justice of the EU is in Luxembourg and the European Central Bank is in Frankfurt.",""],["gov","stable","EU symbols: Europe Day is 9 May (Schuman Declaration, 1950); the EU anthem is Ode to Joy; the motto is United in diversity.",""],["econ","stable","GDP (gross domestic product) is the total value of goods and services a country produces in a year.",""],["econ","stable","Inflation is a general rise in prices. Central banks usually target about 2% inflation a year.",""],["econ","stable","Central banks raise interest rates to fight inflation and cut them to support growth.",""],["econ","stable","Supply and demand: when demand rises and supply stays the same, prices tend to rise.",""],["econ","stable","A recession is commonly defined as two consecutive quarters of falling real GDP.",""],["econ","2025-10","The largest economies by nominal GDP (IMF estimates, mid-2020s): 1. United States (about 30 trillion US dollars), 2. China (about 19 trillion), 3. Germany; Japan and India are close behind and may swap places between IMF editions.","IMF"],["econ","2026-05","The Chair of the US Federal Reserve is Kevin Warsh, sworn in on 22 May 2026. He succeeded Jerome Powell, who stays on as a Fed governor.","CNBC"],["econ","2025-12","The US Federal Reserve cut interest rates three times in 2025 (September, October and 10 December), bringing its target range to 3.50 to 3.75%.","Federal Reserve"],["econ","2026-06","The European Central Bank (ECB) President is Christine Lagarde (term to 31 October 2027). Vice-President: Boris Vujčić (since 1 June 2026).","ECB"],["econ","2026-10","Bank of England Governor: Andrew Bailey. Bank of Japan Governor: Kazuo Ueda.",""],["econ","2026-06","SpaceX held its IPO on 12 June 2026, raising a record 75 billion US dollars at a valuation of 1.77 trillion dollars.","Britannica"],["tech","stable","Charles Babbage designed the Analytical Engine in the 1830s. Ada Lovelace wrote what is considered the first computer program.",""],["tech","stable","Alan Turing described the Turing machine in 1936 and helped break the Enigma code in World War II.",""],["tech","stable","ENIAC (1945) was one of the first general-purpose electronic computers.",""],["tech","stable","The transistor was invented at Bell Labs in 1947. The integrated circuit followed in 1958 to 1959.",""],["tech","stable","ARPANET (1969) was the forerunner of the internet. TCP/IP became its standard on 1 January 1983.",""],["tech","stable","Tim Berners-Lee invented the World Wide Web at CERN (1989 to 1991).",""],["tech","stable","Google was founded in 1998, Wikipedia in 2001, Facebook in 2004, YouTube in 2005. The iPhone launched in 2007. ChatGPT launched on 30 November 2022.",""],["tech","stable","HTML structures web pages, CSS styles them and JavaScript makes them interactive.",""],["tech","2026-09","Apple's CEO is John Ternus since 1 September 2026. He replaced Tim Cook, who became executive chairman. Ternus is Apple's 8th CEO.","CNBC"],["tech","2026-04","Other 2026 CEO changes: Greg Abel replaced Warren Buffett at Berkshire Hathaway, Josh D'Amaro replaced Bob Iger at Disney, and John Furner replaced Doug McMillon at Walmart.","Fortune"],["tech","2026-10","Tech company CEOs: Microsoft Satya Nadella; Alphabet (Google) Sundar Pichai; Amazon Andy Jassy; Meta Mark Zuckerberg; Nvidia Jensen Huang; Tesla and SpaceX Elon Musk; OpenAI Sam Altman; Anthropic Dario Amodei; Google DeepMind Demis Hassabis.",""],["tech","stable","Large language models (LLMs) such as OpenAI's GPT series, Google's Gemini, Anthropic's Claude, Meta's Llama, Alibaba's Qwen and DeepSeek predict text and are trained on huge amounts of data. They can sound confident while being wrong (hallucination). Newest model names change every few months.",""],["health","stable","Normal resting adult vital signs: heart rate 60 to 100 beats per minute, breathing 12 to 20 breaths per minute, body temperature about 37 °C, blood pressure around 120/80 mmHg.",""],["health","stable","Carbohydrates and protein provide about 4 kcal per gram, fat provides about 9 kcal per gram.",""],["health","stable","WHO recommends at least 60 minutes a day of moderate to vigorous physical activity for children and teenagers aged 5 to 17. Teenagers need about 8 to 10 hours of sleep.",""],["health","stable","Vaccines train the immune system to recognise a germ. Edward Jenner developed the smallpox vaccine in 1796. Smallpox was declared eradicated in 1980.","WHO"],["health","stable","Antibiotics kill bacteria but do not work against viruses such as colds and flu. Alexander Fleming discovered penicillin in 1928.",""],["health","stable","Common causes of death and disease: cardiovascular disease (the world's leading cause of death), cancer, diabetes, respiratory infections, malaria, tuberculosis and HIV/AIDS.",""],["health","stable","In Europe the emergency number is 112 (free, works in every EU country).",""],["health","stable","Adult CPR: 30 chest compressions (5 to 6 cm deep, 100 to 120 per minute) followed by 2 rescue breaths, or compressions only if untrained. Use an AED if one is available. Call 112 first.","ERC"],["health","stable","First aid: place an unconscious person who is breathing normally in the recovery position (on their side). For bleeding apply firm direct pressure. Cool a burn under cool running water for about 20 minutes.",""],["health","stable","Anxiety and depression are common and treatable. Talking to a trusted adult, a school counsellor or a doctor helps. In immediate danger call 112.",""],["health","2026-05","On 17 May 2026 WHO declared a public health emergency over an Ebola outbreak in the Democratic Republic of the Congo and Uganda.","Britannica"],["culture","stable","Major authors and works: Homer (Iliad, Odyssey); Dante (Divine Comedy); Shakespeare (Hamlet, Macbeth); Cervantes (Don Quixote); Goethe (Faust); Jane Austen (Pride and Prejudice); Tolstoy (War and Peace); Dostoevsky (Crime and Punishment).",""],["culture","stable","Major authors and works, continued: Victor Hugo (Les Misérables); Kafka (The Metamorphosis); George Orwell (1984); Gabriel García Márquez (One Hundred Years of Solitude); Chinua Achebe (Things Fall Apart).",""],["culture","stable","Art movements in order: Renaissance (Leonardo da Vinci, Michelangelo, Raphael), Baroque (Caravaggio, Rembrandt), Romanticism, Impressionism (Monet, Renoir), Post-Impressionism (Van Gogh, Cézanne), Cubism (Picasso, Braque), Surrealism (Dalí, Magritte), Abstract Expressionism (Pollock), Pop Art (Warhol).",""],["culture","stable","Classical music: Bach and Vivaldi (Baroque); Mozart and Haydn (Classical); Beethoven (bridge to Romantic); Chopin, Tchaikovsky and Wagner (Romantic); Stravinsky and Debussy (20th century).",""],["culture","stable","Popular music milestones: blues and jazz (early 1900s), rock and roll (1950s, Elvis Presley), the Beatles (1960s), hip-hop (1970s, New York).",""],["culture","2026-02","In February 2026 Kendrick Lamar became the hip-hop artist with the most Grammy Awards (27).","Britannica"],["culture","2026-03","The 98th Academy Awards (Oscars) on 15 March 2026: Best Picture went to One Battle After Another (6 Oscars in total). Best Director: Paul Thomas Anderson. Host: Conan O'Brien.","oscars.org"],["culture","2026-03","Oscars 2026 acting winners: Best Actor Michael B. Jordan (Sinners), Best Actress Jessie Buckley (Hamnet), Best Supporting Actress Amy Madigan (Weapons), Best Supporting Actor Sean Penn. Sinners received a record 16 nominations.","oscars.org"],["culture","2026-03","At the 2026 Oscars, KPop Demon Hunters won Best Animated Feature and Best Original Song (\"Golden\"). Autumn Durald Arkapaw (Sinners) became the first woman to win Best Cinematography. Best Casting was awarded for the first time.","oscars.org"],["culture","2026-09","At the Emmy Awards on 14 September 2026, Widow's Bay won 14 awards including best comedy, and The Pitt won best drama.","Britannica"],["culture","2026-07","Major 2026 films: Michael (released 24 April 2026) and Christopher Nolan's The Odyssey (released 17 July 2026).","Britannica"],["culture","stable","World religions by number of followers (approximate): Christianity about 2.3 to 2.4 billion, Islam about 2 billion, Hinduism about 1.2 billion, Buddhism about 500 million, Judaism about 15 million. Many people are non-religious.",""],["culture","stable","English has the most total speakers (about 1.5 billion). Mandarin Chinese has the most native speakers. Next come Hindi, Spanish, French, Arabic, Bengali, Portuguese and Russian.",""],["culture","stable","The UN has six official languages: Arabic, Chinese, English, French, Russian and Spanish. The EU has 24 official languages, including Slovene.",""],["culture","2026-03","Sarah Mullally became the first female Archbishop of Canterbury (installed 25 March 2026).","Britannica"],["sports","2026-07","The 2026 FIFA World Cup (Canada, Mexico, USA; 11 June to 19 July 2026; the first with 48 teams) was won by Spain, who beat Argentina 1-0 after extra time at MetLife Stadium on 19 July 2026 (Ferran Torres scored in the 106th minute). It was Spain's second title. England finished third.","NPR"],["sports","2026-02","At the Milan-Cortina Winter Olympics (6 to 22 February 2026) Norway topped the medal table with 18 gold and 41 total medals, both records. The USA was second with 12 golds. Johannes Høsflot Klæbo won 6 golds, a single-Games record.","NBC Olympics"],["sports","2026-03","At the Milan-Cortina Winter Paralympics (6 to 15 March 2026) China topped the table with 15 gold and 44 total medals.","NBC"],["sports","2026-05","The 2025-26 UEFA Champions League was won by Paris Saint-Germain, who beat Arsenal 1-1 (4-3 on penalties) on 30 May 2026 in Budapest. It was PSG's second title in a row.","Olympics.com"],["sports","2026-05","2026 UEFA Europa League winners: Aston Villa. 2026 UEFA Women's Champions League winners: Barcelona (4-0 sports","stable","The Summer Olympics are held every 4 years: Paris 2024, then Los Angeles 2028. The next Winter Olympics are in the French Alps in 2030.",""],["people","stable","Isaac Newton (1643 to 1727) discovered the laws of motion and universal gravitation.",""],["people","stable","Albert Einstein (1879 to 1955) developed the theories of relativity.",""],["people","stable","Marie Curie (1867 to 1934) researched radioactivity and was the first person to win Nobel Prizes in two sciences.",""],["people","stable","Charles Darwin (1809 to 1882) proposed the theory of evolution by natural selection.",""],["people","stable","Leonardo da Vinci (1452 to 1519) was a Renaissance artist and inventor who painted the Mona Lisa.",""],["people","stable","William Shakespeare (1564 to 1616) was an English playwright.",""],["people","stable","Mahatma Gandhi (1869 to 1948) led India's non-violent independence movement.",""],["people","stable","Nelson Mandela (1918 to 2013) was an anti-apartheid leader and South Africa's first Black president.",""],["people","stable","Martin Luther King Jr. (1929 to 1968) was a leader of the US civil rights movement.",""],["people","2026-05","Ted Turner, founder of CNN, died on 6 May 2026 aged 87.","Britannica"],["events","2025-01","Donald Trump was inaugurated for a second term as US president on 20 January 2025.",""],["events","2025-05","Pope Leo XIV was elected pope on 8 May 2025, after Pope Francis died on 21 April 2025.",""],["events","2026-01","Zohran Mamdani was sworn in as mayor of New York City on 1 January 2026.","Britannica"],["events","2026-01","On 3 January 2026 US forces captured Venezuelan President Nicolás Maduro and his wife Cilia Flores. Maduro was charged in New York.","Britannica"],["events","2026-01","On 8 January 2026 Iran cracked down on nationwide protests. Reported death tolls range from 12,000 to 30,000.","Britannica"],["events","2026-02","On 28 February 2026 the US and Israel attacked Iran and Iran's Supreme Leader Ali Khamenei was killed (the 2026 Iran war). A two-week ceasefire mediated by Pakistan began on 8 April 2026; a later truce collapsed on 8 July 2026 after Iranian attacks on shipping in the Strait of Hormuz.","Britannica"],["events","2026-10","As of 8 to 10 October 2026 the Iran war is unresolved, with a US blockade in force. President Trump said there would be no new strikes before the 3 November 2026 midterms.","Al Jazeera"],["events","2026-03","Slovenia's parliamentary election in March 2026 ended in a near tie.","Wikipedia"],["events","2026-04","Hungary's election on 12 April 2026 was won by Péter Magyar's Tisza party with a two-thirds majority. Magyar became prime minister on 9 May 2026.","Euronews"],["events","2026-04","On 20 April 2026 Apple named John Ternus as its next CEO, effective 1 September 2026.","CNBC"],["events","2026-06","On 24 June 2026 earthquakes of magnitude 7.2 and 7.5 struck north-western Venezuela; about 1,430 people were confirmed dead.","Britannica"],["events","2026-07","On 4 July 2026 the United States celebrated its 250th anniversary.",""],["events","2026-08","On 26 August 2026 a glacier collapse caused deadly flash floods in Nepal and Tibet, killing hundreds.","Britannica"],["events","2026-10","2026 Nobel Prize in Physiology or Medicine (announced 5 October 2026): Karl Deisseroth, Peter Hegemann and Georg Nagel, for optogenetics (light-gated ion channels).","nobelprize.org"],["events","2026-10","2026 Nobel Prize in Physics (announced 6 October 2026): Francis Halzen, for the IceCube Neutrino Observatory and the discovery of high-energy astrophysical neutrinos.","nobelprize.org"],["events","2026-10","2026 Nobel Prize in Chemistry (announced 7 October 2026): Henri B. Kagan and Kenso Soai, for non-linear effects and autocatalysis in asymmetric synthesis.","nobelprize.org"],["events","2026-10","2026 Nobel Prize in Literature (announced 8 October 2026): Anne Carson.","nobelprize.org"],["events","2026-10","2026 Nobel Peace Prize: Navi Pillay (South Africa). The 2026 Nobel economics prize is announced on 12 October 2026.","nobelprize.org"],["slovenia","stable","Slovenia is a parliamentary republic in Central Europe. It borders Italy, Austria, Hungary and Croatia and has a short Adriatic coastline of about 47 km.",""],["slovenia","stable","Slovenia has an area of about 20,271 km² and a population of about 2.1 million.","SURS"],["slovenia","stable","The capital and largest city of Slovenia is Ljubljana (about 300,000 people), on the Ljubljanica River. Maribor is the second-largest city.",""],["slovenia","stable","The official language of Slovenia is Slovene. Italian and Hungarian are co-official in ethnically mixed areas.",""],["slovenia","stable","Slovenia's currency is the euro since 1 January 2007. Slovenia was the first former-communist country to adopt it.",""],["slovenia","stable","Slovenia's highest peak is Triglav (2,864 m), which appears on the national coat of arms and lies in Triglav National Park.",""],["slovenia","stable","Well-known natural sites in Slovenia: Lake Bled, Lake Bohinj, Postojna Cave, the Škocjan Caves (UNESCO World Heritage Site) and the Soča River. The Lipizzaner horse breed is named after Lipica, Slovenia.",""],["slovenia","stable","Slovenia was part of the Habsburg lands, then of the Kingdom of Serbs, Croats and Slovenes and Yugoslavia from 1918. Slovenia declared independence on 25 June 1991 (Statehood Day), followed by the Ten-Day War.",""],["slovenia","stable","Slovenia joined NATO on 29 March 2004 and the EU on 1 May 2004. It joined the Schengen Area in December 2007 and held the EU Council presidency in 2008 and 2021.",""],["slovenia","stable","Slovenia's parliament has the National Assembly (90 deputies) and the National Council (40 members). A prime minister needs 46 votes in the first round to be elected.",""],["slovenia","2027-01","The President of Slovenia is Nataša Pirc Musar (since 23 December 2022). The next presidential election is due in 2027.","Wikipedia"],["slovenia","2026-06","The Prime Minister of Slovenia is Janez Janša (SDS). He was elected by the National Assembly on 22 May 2026 and his government took office on 4 June 2026. It is his fourth term (also 2004 to 2008, 2012 to 2013 and 2020 to 2022).","Al Jazeera"],["slovenia","2026-06","Slovenia's governing coalition is SDS, New Slovenia (NSi), the Democrats, the Slovenian People's Party (SLS) and Focus. Deputy prime ministers: Jernej Vrtovec (NSi) and Anže Logar (Democrats). Foreign minister: Tone Kajzer.","Wikipedia"],["slovenia","2026-06","The previous Prime Minister of Slovenia was Robert Golob (Freedom Movement), from 1 June 2022 to 4 June 2026.","Wikipedia"],["slovenia","stable","France Prešeren is Slovenia's national poet. The 7th stanza of his poem Zdravljica is the national anthem. 8 February (Prešeren Day) is Slovenian Culture Day.",""],["slovenia","stable","Ivan Cankar was a famous Slovenian writer. Jože Plečnik was the architect who shaped much of Ljubljana; his Ljubljana works are a UNESCO World Heritage Site.",""],["slovenia","2026-10","Notable Slovenians: Tadej Pogačar and Primož Roglič (cyclists), Luka Dončić (basketball), Janja Garnbret (sport climbing, Olympic champion), Domen Prevc (ski jumping), Slavoj Žižek (philosopher), Herman Potočnik Noordung (space-station pioneer).",""],["slovenia","stable","Ljubljana facts: the dragon is the city symbol (Dragon Bridge). Other landmarks are Ljubljana Castle and the Triple Bridge. Ljubljana was European Green Capital in 2016.",""],["slovenia","stable","The European Schools are an intergovernmental school system created in 1953 for children of EU staff. Students study in language sections and finish with the European Baccalaureate.",""],["daily","stable","Slovenia uses Central European Time (CET, UTC+1) in winter and Central European Summer Time (CEST, UTC+2) in summer. Clocks change on the last Sunday of March and the last Sunday of October; in 2026 the change back is on 25 October.",""],["daily","stable","UTC (Coordinated Universal Time) is the world time standard. The UK uses GMT/BST, New York is UTC-5 or UTC-4 (summer) and Tokyo is UTC+9.",""],["daily","stable","The Gregorian calendar was introduced in 1582. A year has 365 days, or 366 in a leap year.",""],["daily","stable","Leap year rule: a year is a leap year if it is divisible by 4, except century years, which must be divisible by 400. So 2000 was a leap year, 1900 was not and 2028 will be.",""],["daily","stable","Length conversions: 1 inch = 2.54 cm; 1 foot = 30.48 cm; 1 mile = 1.609 km; 1 km = 0.621 miles.",""],["daily","stable","Mass and volume conversions: 1 kg = 2.205 pounds; 1 pound = 453.6 g; 1 litre = 1,000 cm³; 1 US gallon = 3.785 litres.",""],["daily","stable","Temperature conversion: °F = °C × 9/5 + 32; °C = (°F - 32) × 5/9.",""],["daily","stable","Common abbreviations: EU (European Union), UN (United Nations), NATO, WHO (World Health Organization), GDP (gross domestic product), CEO (chief executive officer), AI (artificial intelligence), CPU (central processing unit), URL (web address), DNA (deoxyribonucleic acid), e.g. (for example), i.e. (that is), BCE/CE (before the Common Era / Common Era).",""],["daily","stable","How electricity works: an electric current is the flow of electrons pushed by a voltage. European mains power is 230 volts at 50 hertz.",""],["daily","stable","A four-stroke petrol engine repeats intake, compression, power (combustion) and exhaust. Electric cars use batteries and electric motors instead.",""],["daily","stable","How the internet works: data is split into packets that are routed between computers using IP addresses and TCP. DNS translates names such as example.com into IP addresses.",""],["daily","stable","Study skills that work according to research: test yourself instead of rereading (retrieval practice), review over days and weeks (spaced repetition), mix problem types (interleaving), explain ideas in your own words and sleep well before exams.",""]];

/* ---------- core facts: a small library that ships inside Lumen, works offline and is searched for every question ----------
   The facts live in 159-core-data.js (made from core-facts.txt). Nothing here is sent anywhere. */
const Core = (() => {
  const CAT_WORDS = { sci: 'science', math: 'mathematics maths', hist: 'history', geo: 'geography', gov: 'government politics', econ: 'economy economics', tech: 'technology',
    health: 'health medicine', culture: 'culture arts', sports: 'sport sports', people: 'people', events: 'news events', slovenia: 'slovenia', daily: 'everyday' };
  // short forms and adjectives people type, turned into the words the facts use
  const ALIAS = { pm: 'prime minister', ww1: 'world war i', wwi: 'world war i', ww2: 'world war ii', wwii: 'world war ii', uae: 'united arab emirates',
    britain: 'united kingdom', british: 'united kingdom', america: 'united states', american: 'united states', americans: 'united states',
    slovene: 'slovenia', slovenian: 'slovenia', slovenians: 'slovenia', german: 'germany', french: 'france', japanese: 'japan', chinese: 'china', russian: 'russia',
    indian: 'india', italian: 'italy', spanish: 'spain', canadian: 'canada', brazilian: 'brazil', ukrainian: 'ukraine', iranian: 'iran', hungarian: 'hungary',
    polish: 'poland', dutch: 'netherlands', swedish: 'sweden', austrian: 'austria', croatian: 'croatia', leader: 'president prime minister', capital: 'capital',
    covid: 'covid-19 coronavirus', coronavirus: 'covid-19 coronavirus', gpt: 'gpt chatgpt', ai: 'artificial intelligence ai' };
  const FILLER = new Set('latest current currently recent recently now today tonight newest upcoming new info information fact facts wiki wikipedia ever called named name free online list top person people'.split(' '));
  let UNITS = null, DF = null;

  /* A line such as "Austria: ... Belgium: ... Croatia: ..." is split so that a question about one country gets only that country. */
  function splitList(text) {
    const segs = text.split(/(?<=[.;])\s+(?=[A-Z])/);
    if (segs.length < 3 || segs.filter(s => /^[A-Z][^:]{1,40}:\s/.test(s)).length < 3) return [text];
    const out = [];
    for (const s of segs) { if (/^[A-Z][^:]{1,40}:\s/.test(s) || !out.length) out.push(s); else out[out.length - 1] += ' ' + s; }
    return out;
  }
  function build() {
    if (UNITS) return;
    UNITS = [];
    for (const [cat, asof, text, source] of CORE_FACTS) {
      for (const t of splitList(text)) {
        const seq = terms(t);
        UNITS.push({ cat, asof, text: t, source, seq: ' ' + seq.join(' ') + ' ', set: new Set([...seq, ...terms(CAT_WORDS[cat] || '')]) });
      }
    }
    DF = new Map();
    for (const u of UNITS) for (const t of u.set) DF.set(t, (DF.get(t) || 0) + 1);
  }
  function queryTerms(q) {
    let s = ' ' + String(q || '').replace(/\bworld war (2|two)\b/gi, 'world war ii').replace(/\bworld war (1|one)\b/gi, 'world war i').replace(/\bU\.?S\.?A?\b/g, ' united states ').replace(/\bU\.?K\.?\b/g, ' united kingdom ') + ' ';
    s = s.replace(/[A-Za-z0-9]+/g, w => ALIAS[w.toLowerCase()] ? ' ' + ALIAS[w.toLowerCase()] + ' ' : w);
    return [...new Set(terms(s, false).filter(t => !FILLER.has(t)))];
  }
  const monthYear = a => {
    const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(a); if (!m) return '';
    const mon = new Date(Date.UTC(+m[1], +m[2] - 1, 1)).toLocaleDateString('en-GB', { month: 'long', timeZone: 'UTC' });
    return (m[3] ? +m[3] + ' ' : '') + mon + ' ' + m[1];
  };

  /* Find the facts that fit a question: every word counts by how rare it is in the library, and a fact must match most of the question's words. */
  function find(question, { max = 4, chars = 1100 } = {}) {
    if (typeof CORE_FACTS === 'undefined') return [];
    build();
    const Q = queryTerms(question).filter(t => DF.has(t));
    if (!Q.length) return [];
    const idf = t => Math.log(1 + UNITS.length / (DF.get(t) || 1));
    const den = Q.reduce((a, t) => a + idf(t), 0);
    const all = queryTerms(question);   // order is kept for the pair bonus
    const scored = [];
    const proper = new Set((String(question).match(/(?<![.!?]\s|^)\b[A-Z][a-z]{2,}/g) || []).flatMap(w => terms(w)));   // names typed with a capital letter
    UNITS.forEach((u, i) => {
      const hit = Q.filter(t => u.set.has(t));
      if (!hit.length) return;
      let s = hit.reduce((a, t) => a + idf(t), 0);
      const cov = s / den;
      // one matching word is enough only when the question is that one word (no unknown words next to it) and it is a name or a rare word
      if (hit.length < 2 && !(all.length === 1 && !GENERIC.has(hit[0]) && idf(hit[0]) >= (proper.has(hit[0]) ? 1.5 : 3.2))) return;
      if (hit.length >= 2 && cov < 0.45) return;
      const head = u.seq.trim().split(' ').slice(0, 4), cw = terms(CAT_WORDS[u.cat] || '');
      for (const t of hit) { if (head.includes(t)) s += 0.3 * idf(t); if (cw.includes(t)) s += 0.5 * idf(t); }   // the subject of a fact, and its own category, count more
      for (let k = 0; k + 1 < all.length; k++) if (u.seq.includes(' ' + all[k] + ' ' + all[k + 1] + ' ')) s += 0.5 * (idf(all[k]) + idf(all[k + 1])) / 2;
      scored.push({ u, s, i });
    });
    if (!scored.length) return [];
    scored.sort((a, b) => b.s - a.s || a.i - b.i);
    const best = scored[0].s, out = [];
    let used = 0;
    for (const x of scored) {
      if (x.s < best * 0.75 || out.length >= max) break;
      if (out.length && used + x.u.text.length > chars) break;
      out.push({ cat: x.u.cat, asof: x.u.asof, text: x.u.text, source: x.u.source });
      used += x.u.text.length;
    }
    return out;
  }

  /* The notes section for the model. */
  function section(items) {
    if (!items?.length) return null;
    const age = Math.floor((Date.now() - Date.parse(CORE_CHECKED)) / 864e5);
    const lead = `Facts built into Lumen, checked on ${monthYear(CORE_CHECKED)}. For office-holders, news, records and prices they can be newer than your own knowledge, so use them, but only the ones that answer the question. If a live Wikipedia or news note says something newer, trust that one instead and mention it.`
      + (age > 60 ? ` These facts are ${age} days old, so for anything that can change (who holds an office, results, prices) tell the user they may be out of date.` : '');
    return { site: 'Lumen', title: 'Built-in core facts', url: '', desc: 'checked ' + monthYear(CORE_CHECKED), core: true,
      paras: [lead, ...items.map(i => '• ' + i.text + (i.asof !== 'stable' ? ` (as of ${monthYear(i.asof)})` : ''))] };
  }
  const enabled = () => S.learn?.core !== false;
  const count = () => (typeof CORE_FACTS === 'undefined' ? 0 : CORE_FACTS.length);
  return { find, section, enabled, count, checked: () => monthYear(CORE_CHECKED), queryTerms };
})();

/* ---------- Essay feedback: comments that quote your own sentences, checked by code. Feedback only, never a finished essay. ---------- */
const ESSAY_KINDS = ['Structure', 'Clarity', 'Grammar', 'Evidence', 'Style'];
const ESSAY_PRIORITY = { Structure: 0, Evidence: 1, Clarity: 2, Grammar: 3, Style: 4 };
const ESSAY_MAX_WORDS = 3000;
const ESSAY_SYS_PARA = 'You give feedback on ONE paragraph of a student essay, to help the student improve it. Never rewrite the whole paragraph. Find up to 3 real problems. For each one, copy ONE exact sentence (or a part of a sentence of at least 5 words) from the paragraph into "quote", exactly as written, mistakes included. "kind" is one of Structure, Clarity, Grammar, Evidence, Style. "comment" says what is wrong and how to fix it, in simple words, at most 30 words. "better" is a short improved version of only that quote. If the paragraph has no real problems, return an empty list.';
const ESSAY_SYS_TOP = 'You choose the most important fixes for a student essay. You get a numbered list of comments and the essay. Pick the 3 comments that would improve the essay the most, most important first, as a list of their numbers in "top". Also add up to 2 problems that only show when reading the whole essay (for example an idea repeated in two paragraphs, a missing conclusion): each with an exact "quote" copied from the essay, a "kind" and a "comment" of at most 30 words. Use an empty "extra" list if there are none.';
const ESSAY_SYS_RUBRIC = 'You estimate the level a student essay reaches, using the teacher\'s rubric. For each criterion in the rubric (at most 8), say the level using the rubric\'s own level names or numbers, and why in at most 20 words. This is only an estimate.';
const ESSAY_SCHEMAS = {
  para: { type: 'object', properties: { comments: arr({ type: 'object', properties: { quote: { type: 'string' }, kind: { type: 'string', enum: ESSAY_KINDS }, comment: { type: 'string' }, better: { type: 'string' } }, required: ['quote', 'kind', 'comment'] }, 0, 3) }, required: ['comments'] },
  top: { type: 'object', properties: { top: arr({ type: 'integer' }, 0, 3), extra: arr({ type: 'object', properties: { quote: { type: 'string' }, kind: { type: 'string', enum: ESSAY_KINDS }, comment: { type: 'string' } }, required: ['quote', 'kind', 'comment'] }, 0, 2) }, required: ['top', 'extra'] },
  rubric: { type: 'object', properties: { levels: arr({ type: 'object', properties: { criterion: { type: 'string' }, level: { type: 'string' }, why: { type: 'string' } }, required: ['criterion', 'level', 'why'] }, 1, 8) }, required: ['levels'] },
};

/* Split into numbered paragraphs. One long block is cut at sentence ends (small models cope better with short input). */
function essayParagraphs(text) {
  let paras = String(text || '').replace(/\r/g, '').split(/\n\s*\n+/).map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const words = p => p.split(/\s+/).length;
  if (paras.length === 1 && words(paras[0]) > 180) {
    const sents = paras[0].match(/[^.!?]+[.!?]+["”')\]]*\s*|[^.!?]+$/g) || [paras[0]];
    paras = []; let cur = '';
    for (const s of sents) { if (cur && words(cur + s) > 110) { paras.push(cur.trim()); cur = ''; } cur += s; }
    if (cur.trim()) paras.push(cur.trim());
  }
  return paras.filter(p => words(p) >= 8).slice(0, 14);   // a title or a one-line heading is not a paragraph
}
const trimQuote = q => String(q || '').replace(/^(?:\.{3}|…|\s)+|(?:\.{3}|…|\s)+$/g, '');
const essayNorm = s => String(s || '').toLowerCase().replace(/[“”"'’‘`]/g, '').replace(/\s+/g, ' ').trim();
/* A quote counts only if it really is in the text. */
function quoteInText(quote, text) {
  const q = essayNorm(trimQuote(quote).replace(/[.!?]+$/, ''));
  return q.length >= 8 && essayNorm(text).includes(q);
}
const kindOf = k => ESSAY_KINDS.find(x => x.toLowerCase() === String(k || '').trim().toLowerCase())
  || (/spell|punct|grammar|tense/i.test(k) ? 'Grammar' : /struct|topic|order|organi/i.test(k) ? 'Structure' : /evid|example|source|support/i.test(k) ? 'Evidence' : /clar|unclear|vague/i.test(k) ? 'Clarity' : 'Style');
const cleanComments = d => {
  if (!d || !Array.isArray(d.comments)) throw new Error('bad essay json');
  return { comments: d.comments.filter(c => c && typeof c.quote === 'string' && typeof c.comment === 'string').slice(0, 3)
    .map(c => ({ quote: c.quote.trim(), kind: kindOf(c.kind), comment: tidy(c.comment, 220), better: typeof c.better === 'string' ? tidy(c.better, 300) : '' })) };
};

/* Keep only the comments whose quote is really in the paragraph; count the ones dropped. */
function verifyComments(found, paras) {
  const out = []; let dropped = 0; const seen = new Set();
  found.forEach((list, pi) => {
    for (const c of list) {
      const key = essayNorm(c.quote);
      if (!quoteInText(c.quote, paras[pi]) || seen.has(key) || !c.comment) { dropped++; continue; }
      seen.add(key); out.push({ ...c, quote: trimQuote(c.quote), para: pi + 1 });
    }
  });
  return { comments: out, dropped };
}
/* The top fixes: the model picks numbers from the verified list; code fills any gap by importance. */
function pickTop(comments, picked) {
  const top = []; const used = new Set();
  for (const n of picked || []) { const c = comments[n - 1]; if (Number.isInteger(n) && c && !used.has(n)) { used.add(n); top.push(c); } }
  const rest = comments.map((c, i) => ({ c, i: i + 1 })).filter(x => !used.has(x.i)).sort((a, b) => ESSAY_PRIORITY[a.c.kind] - ESSAY_PRIORITY[b.c.kind] || a.i - b.i);
  for (const x of rest) { if (top.length >= 3) break; top.push(x.c); }
  return top.slice(0, 3);
}
const esc2 = s => String(s).replace(/([\\`*_{}\[\]|])/g, '\\$1');
function essayMarkdown({ words, nParas, top, comments, rubric, dropped, clipped }) {
  const q = c => `“${esc2(c.quote)}”`;
  let md = `Here is feedback on your essay (${words} words, ${nParas} paragraph${nParas === 1 ? '' : 's'}). It is feedback only: the writing stays yours.\n\n`;
  if (clipped) md += `*I read only the first ${ESSAY_MAX_WORDS} words.*\n\n`;
  md += '## Top 3 fixes\n\n';
  if (!top.length) md += 'Lumen could not find reliable comments this time. Try again, or paste a shorter part.\n\n';
  let tries = 0;
  top.forEach((c, i) => { md += `${i + 1}. **${c.kind}, paragraph ${c.para}.** ${q(c)} ${esc2(c.comment)}\n`; if (c.better && tries++ < 2) md += `   - *You could try:* ${esc2(c.better)}\n`; });
  for (const k of ESSAY_KINDS) {
    const list = comments.filter(c => c.kind === k);
    md += `\n## ${k}\n\n` + (list.length ? list.map(c => `- ¶${c.para} ${q(c)}: ${esc2(c.comment)}`).join('\n') : 'Nothing flagged here. That does not mean it is perfect.') + '\n';
  }
  if (rubric?.length) md += '\n## Rubric estimate\n\n| Criterion | Estimated level | Why |\n| --- | --- | --- |\n' + rubric.map(r => `| ${esc2(r.criterion)} | ${esc2(r.level)} | ${esc2(r.why)} |`).join('\n') + '\n\n*This is a small AI’s estimate, not a grade.*\n';
  md += `\n---\nEvery quote above was checked by code and is really in your essay.${dropped ? ` ${dropped} comment${dropped > 1 ? 's' : ''} with a quote that is not in your essay ${dropped > 1 ? 'were' : 'was'} dropped.` : ''}`;
  return md;
}

async function runEssay(chat, userMsg) {
  const run = beginRun(chat, { mode: 'fast', style: S.style });
  const { am } = run;
  const t0 = performance.now();
  try {
    const raw = String(userMsg.essay?.text || '');
    const allWords = raw.trim().split(/\s+/).filter(Boolean);
    const clipped = allWords.length > ESSAY_MAX_WORDS;
    const text = clipped ? raw.split(/(\s+)/).slice(0, ESSAY_MAX_WORDS * 2).join('') : raw;
    const paras = essayParagraphs(text);
    if (!paras.length) throw Object.assign(new Error('The essay is too short to give feedback on. Paste at least a full paragraph.'), { friendly: true });
    setWork(am, 'Getting the AI model ready');
    await ensureModel(run);
    run.checkStop();
    const found = [];
    for (let i = 0; i < paras.length; i++) {
      setWork(am, `Reading paragraph ${i + 1} of ${paras.length}`, i / (paras.length + 1));
      let d = { comments: [] };
      try { d = await generateJSON({ system: ESSAY_SYS_PARA, user: `Paragraph ${i + 1} of ${paras.length}:\n<paragraph>\n${paras[i].replace(/<\/?paragraph>/gi, '')}\n</paragraph>`, schema: ESSAY_SCHEMAS.para, maxTokens: 420, signal: run.ctl.signal, check: cleanComments }); }
      catch (e) { if (run.stopped || e?.message === 'stopped') throw e; console.warn('essay paragraph failed', e); }
      run.checkStop();
      found.push(d.comments);
    }
    const ver = verifyComments(found, paras);
    let comments = ver.comments, dropped = ver.dropped;
    setWork(am, 'Reading the whole essay', paras.length / (paras.length + 1));
    let top = [];
    if (comments.length) {
      const list = comments.map((c, i) => `[${i + 1}] paragraph ${c.para}, ${c.kind}: “${clip(c.quote, 90)}” ${c.comment}`).join('\n');
      let t = { top: [], extra: [] };
      try {
        t = await generateJSON({ system: ESSAY_SYS_TOP, user: `Comments:\n${list}\n\nEssay:\n<essay>\n${clip(paras.join('\n\n').replace(/<\/?essay>/gi, ''), 9000)}\n</essay>`, schema: ESSAY_SCHEMAS.top, maxTokens: 420, signal: run.ctl.signal,
          check: d => ({ top: Array.isArray(d?.top) ? d.top.map(Number).filter(Number.isInteger).slice(0, 3) : [], extra: Array.isArray(d?.extra) ? d.extra.filter(x => x && typeof x.quote === 'string' && typeof x.comment === 'string').slice(0, 2).map(x => ({ quote: x.quote.trim(), kind: kindOf(x.kind), comment: tidy(x.comment, 220), better: '' })) : [] }) });
      } catch (e) { if (run.stopped || e?.message === 'stopped') throw e; console.warn('essay overview failed', e); }
      run.checkStop();
      // whole-essay problems: the quote must be in the essay, and code finds which paragraph it is in
      for (const x of t.extra) {
        const pi = paras.findIndex(p => quoteInText(x.quote, p));
        if (pi < 0 || comments.some(c => essayNorm(c.quote) === essayNorm(x.quote))) { dropped++; continue; }
        comments.push({ ...x, quote: trimQuote(x.quote), para: pi + 1 });
      }
      top = pickTop(comments, t.top);
    }
    let rubric = null;
    const rub = String(userMsg.essay?.rubric || '').trim();
    if (rub && comments.length + 1) {
      setWork(am, 'Comparing with your rubric', 0.9);
      try {
        const r = await generateJSON({ system: ESSAY_SYS_RUBRIC, user: `Rubric:\n<rubric>\n${clip(rub.replace(/<\/?rubric>/gi, ''), 3000)}\n</rubric>\n\nEssay:\n<essay>\n${clip(paras.join('\n\n').replace(/<\/?essay>/gi, ''), 8000)}\n</essay>`, schema: ESSAY_SCHEMAS.rubric, maxTokens: 500, signal: run.ctl.signal,
          check: d => { if (!Array.isArray(d?.levels) || !d.levels.length) throw new Error('bad rubric json'); return d.levels.filter(x => x && x.criterion && x.level).slice(0, 8).map(x => ({ criterion: tidy(x.criterion, 80), level: tidy(x.level, 40), why: tidy(x.why || '', 160) })); } });
        rubric = r;
      } catch (e) { if (run.stopped || e?.message === 'stopped') throw e; console.warn('essay rubric failed', e); }
    }
    run.checkStop();
    am.content = essayMarkdown({ words: allWords.length, nParas: paras.length, top, comments, rubric, dropped, clipped });
    am.essayInfo = { paras: paras.length, comments: comments.length, dropped };
    am.note = 'Feedback only. Every quote was checked against your essay';
    am.stats = { secs: (performance.now() - t0) / 1000 };
    am.state = 'done';
  } catch (e) {
    if (run.stopped || e?.message === 'stopped') am.state = 'stopped';
    else { console.error(e); am.state = 'error'; am.error = e?.friendly ? e.message : friendlyError(e); }
  } finally {
    await endRun(run, t0);
  }
}

/* The form: your essay, and (if you have one) the teacher's rubric. */
function openEssayDialog(prefill = '') {
  openViewer('Essay feedback', () => {
    const essay = h('textarea', { id: 'essayText', rows: 8, placeholder: 'Paste your essay here', spellcheck: 'true' });
    essay.value = prefill;
    const rubric = h('textarea', { id: 'essayRubric', rows: 4, placeholder: 'Optional: paste the teacher’s rubric here', spellcheck: 'false' });
    const hint = h('p', { class: 'hint', text: '' });
    const upd = () => { const n = essay.value.trim().split(/\s+/).filter(Boolean).length; hint.textContent = n ? `${n} words${n > ESSAY_MAX_WORDS ? ` (Lumen reads the first ${ESSAY_MAX_WORDS})` : ''}.` : ''; };
    essay.addEventListener('input', upd); upd();
    const go = h('button', { class: 'btn primary', type: 'button', text: 'Get feedback', onclick: () => {
      const t = essay.value.trim();

      if (App.run) { toast('Lumen is still answering. Press Stop first.'); return; }

      send(`Feedback on my essay (${n} words): “${clip(t.replace(/\s+/g, ' '), 70)}”`, { essay: { text: t, rubric: rubric.value.trim() }, cmd: 'essay' });

      h('label', { for: 'essayText', text: 'Your essay' }), essay, hint, h('label', { for: 'essayRubric', text: 'Rubric (optional)' }), rubric, h('div', { class: 'opt-row' }, go));
  });
}

/* ---------- running a turn ---------- */
function setWork(am, text, progress = null) { am.workText = text; am.workProgress = progress; paintLive(); }
async function ensureModel(run) {
  const am = run.am;
  if (Brain.state === 'ready' && Brain.loadedKey === S.model && Brain.ctxWanted === ctxTarget(Brain.model(S.model))) return;
  if (Brain.state === 'unsupported') throw new Error(Brain.unsupportedWhy);
  const update = () => {
    if (App.run?.am !== am || Brain.state !== 'loading') return;
    am.modelLoading = true;
    setWork(am, `Getting the AI model ready: ${(Brain.phase || 'starting').toLowerCase()}`, Brain.progress || null);
  };
  Brain.listeners.add(update);
  try {
    setWork(am, 'Getting the AI model ready');
    // Stop works right away, even while the model is still downloading (the download itself carries on).
    await Promise.race([Brain.load(S.model), run.stopped$.then(() => { throw new Error('stopped'); })]);
  } finally { Brain.listeners.delete(update); am.modelLoading = false; }
}
/* Start a run: the assistant message that fills in while Lumen works, and the Stop handle. */
function beginRun(chat, extra = {}) {
  const model = Brain.model(S.model);
  const am = { id: uid(), role: 'assistant', content: '', thinking: '', sources: [], state: 'working', style: S.style, modelName: model.name, created: Date.now(), phase: 'prep', ...extra };
  { const lu = [...chat.messages].reverse().find(x => x.role === 'user'); if (lu && Care.check(lu.content)) am.care = 1; }   // the message is about hurting oneself: show where to get help
  if (chat._pendingFork) { am.fork = chat._pendingFork; chat._pendingFork = null; }   // this answer is a new version of an earlier one
  chat.messages.push(am);
  chat.updated = Date.now();
  const run = { chat, am, stopped: false, ctl: new AbortController() };
  run.stopped$ = new Promise(res => { run.onStop = res; });
  App.run = run;
  renderThread(); renderSidebar();
  scrollToBottom(true);
  run.saveTimer = setInterval(() => saveChat(chat), 2500);
  run.checkStop = () => { if (run.stopped) throw new Error('stopped'); };
  return run;
}
async function endRun(run, t0) {
  const { chat, am } = run;
  clearInterval(run.saveTimer);
  if (am.tThink0 && !am.tThink1) am.tThink1 = Date.now();
  am.phase = ''; am.workText = ''; am.workProgress = null;
  if (am.state === 'stopped') am.content = cleanAnswer(am.content).trim();
  App.run = null;
  chat.updated = Date.now();
  await saveChat(chat);
  if (chat.id === App.currentId) { const n = nodeFor(am); if (n) fillAssistant(n, am, chat); else renderThread(); }
  renderSidebar(); updateComposer(); updateMeter();
  if (am.state === 'done') { try { Usage.addAnswer(am.mode); } catch {} scheduleSummary(chat); }
}

/* Should the files attached to this chat be used for this question? */
function wantDocs(chat, userMsg, prevUsedDocs) {
  if (!chat.docs?.length) return false;
  if (userMsg.attach?.length || userMsg.ovr?.docs) return true;
  const t = userMsg.content || '';
  if (/\b(files?|documents?|docs?|pdf|pages?|slides?|sheets?|spreadsheet|paper|article|texts?|essay|notes|attached|uploads?|uploaded|above|according to|in (?:it|this|the (?:text|document|file|pdf)))\b/i.test(t)) return true;
  if (prevUsedDocs && isFollowUp(t)) return true;
  const q = coreTerms(t);
  if (!q.length) return false;
  const hay = chat.docs.map(d => d.text.toLowerCase()).join(' ');
  const hit = q.filter(w => hay.includes(w)).length;
  return hit >= Math.min(2, q.length) && hit / q.length >= 0.5;
}

async function runTurn(chat, userMsg) {
  const ovr = userMsg.ovr || {};
  const idx = chat.messages.indexOf(userMsg);
  const prevMsgs = chat.messages.slice(0, idx);
  const prevUser = [...prevMsgs].reverse().find(m => m.role === 'user')?.content || '';
  const prevAi = [...prevMsgs].reverse().find(m => m.role === 'assistant');
  const style = ovr.style || (S.style === 'normal' && chat.role && ROLES[chat.role]?.style) || S.style;
  const question = userMsg.content;
  const low = question.toLowerCase();

  // What does this question need? Files, exact tools, live data, Wikipedia?
  const docsOn = wantDocs(chat, userMsg, !!prevAi?.usedDocs);
  const local = localToolLines(question);
  const toolHit = S.wiki === 'off' || ovr.search === 'off' || userMsg.noLookup ? false : liveToolPlan(question).length > 0;
  const exactOnly = local.lines.length > 0 && coreTerms(question).filter(w => !/^\d+$/.test(w)).length <= 3 && !REASON_RE.test(low);
  const toolOnly = toolHit && !REASON_RE.test(low);
  let modeKey = ovr.mode || S.mode, auto = false, autoWhy = '';
  if (MODES[modeKey]?.auto || !MODES[modeKey]) {
    const pk = pickMode(question, { hasDocs: docsOn, exactOnly, toolOnly });
    modeKey = pk.key; auto = true; autoWhy = pk.why;
  }
  const mode = MODES[modeKey];
  const run = beginRun(chat, { mode: mode.key, auto, autoWhy, style });
  const { am } = run;
  const t0 = performance.now();
  const checkStop = run.checkStop;
  try {
    let P = planBudget(mode, style, ctxNow(), docsOn, Saver.active());

    // Decide on a look-up. It runs while the model starts, so it costs no extra time.
    const forceSearch = ovr.search === 'on';
    const searchOff = S.wiki === 'off' || ovr.search === 'off' || userMsg.noLookup;
    const solving = ovr.playbook === 'math';   // /solve: a school problem needs the calculator and the layout, not Wikipedia
    const wikiOn = !searchOff && (forceSearch || toolHit || (!docsOn && (S.wiki === 'always' ||
      (!exactOnly && !solving && shouldLookUp(isFollowUp(question) && prevUser ? prevUser + ' ' + question : question)))));
    // what Lumen has learned: names it was taught become extra search words, and saved notes that fit join the notes
    const lrn = await Learn.forQuestion(question, prevUser, { pick: ovr.pick, recent: analyze(question).recent, skipLibrary: !!(userMsg.noLookup || ovr.search === 'off' || docsOn || exactOnly) }).catch(() => null);
    const onStep = s => { am.lookStep = s; if (!am.modelLoading) setWork(am, s); };
    // If the first search finds nothing that matches, the model is asked to fix the spelling of the search words.
    const rewrite = Saver.active() ? undefined : async () => { await ensureModel(run); checkStop(); return planQueries(question, prevUser); };
    const doGather = planned => gather({ question, prevQuestion: prevUser, plannedQueries: planned, maxArticles: mode.articles, charBudget: P.notesChars,
      signal: run.ctl.signal, onStep, rewrite, simple: mode.key === 'deep' || style === 'simple', wikiOn, forceWeb: forceSearch, learned: lrn, prefer: lrn?.prefer, core: Core.enabled() && !docsOn && !exactOnly && !userMsg.noLookup && ovr.search !== 'off' })
      .catch(e => (run.stopped ? null : { offline: true, sources: [], quality: 'offline', exact: local.lines, used: [], failed: [] }));
    let notesP = !mode.plan ? doGather(null) : null;

      notes = await notesP;

      if (notes?.used?.length) am.usedSrc = notes.used;
      if (notes?.kbUsed?.length) Learn.markUsed(notes.kbUsed);
      if (notes?.learn?.length && notes.quality === 'good') Learn.saveLookups(notes.learn).catch(() => {});

      if (notes) { am._packText = notes.packText?.length ? notes.packText : undefined; notes.wanted = wikiOn; am.exact = notes.exact?.length ? notes.exact : undefined; am.notes = notes.block ? clip(notes.block, 14000) : undefined; }

    checkStop();

    const playbook = ovr.playbook || pickPlaybook(question, { hasDocs: !!docs, hasLive: !!(notes?.used || []).some(u => ['weather', 'fx', 'crypto'].includes(u)), hasNews: !!(notes?.used || []).some(u => ['events', 'gdelt', 'hn'].includes(u)) || !!notes?.recent });
    const exs = Examples.pick(question, playbook, { skip: !!(userMsg.study || userMsg.essay || docsOn || Saver.active() || notes?.exact?.length || ovr.vote) });
    const built = buildMessages({ chat, userMsg, notes, exact: notes?.exact?.length ? notes.exact : local.lines, docs, budget: P.promptBudget, histTokens: P.histTokens, style, think: mode.think, playbook, examples: exs });

    if (built.truncated) am.note = 'Your message was very long, so Lumen read only the first part';
    // Voting: Deep mode, a short checkable answer; the model is asked to end with "Final answer: X"
    const voting = mode.key === 'deep' && !Saver.active() && !docsOn && !notes?.exact?.length && !userMsg.study && !userMsg.essay && (ovr.vote || (S.vote.on && voteWorthy(question))) && !!built.messages.length;
    if (voting) { const lu = built.messages[built.messages.length - 1]; built.messages[built.messages.length - 1] = { ...lu, content: lu.content + VOTE_ASK }; }
    setWork(am, mode.think ? 'Thinking it through' : 'Writing the answer', mode.think ? 0 : null);

      am.thinking = trimRepeat(am.thinking || '');

      const last = built.messages[built.messages.length - 1];
      const msgs2 = built.messages.slice(0, -1).concat([{ role: 'user', content: last.content + (notesSoFar ? `\n\n(Your reasoning notes so far:\n${notesSoFar}\n)` : '') + '\n\nNow write the final answer for me. Do not repeat the notes.' }]);

      const res2 = await Brain.generate({
        messages: msgs2, think: false, ...samplingFor(false), max_tokens: P.answerMax,
        onDelta: (d, full) => {
          n2++;

    if (am._packText?.length && am.content) { const n = Examples.copiedRun(am.content, am._packText.map(a => ({ a }))); if (n >= 8) am.packCopy = n; }

      const extra = first.key ? await voteExtra({ am, run, messages: built.messages, maxTokens: P.answerMax }) : [];
      if (!run.stopped && extra.length) {
        const tries = [first, ...extra.map(t => { const a = finalAnswerOf(t); return { text: t, ans: a, key: voteKey(a) }; })];
        const v = voteTally(tries);
        am.vote = { n: tries.length, answers: tries.map(t => t.ans || '(none)'), winner: v.pick ? v.pick.ans : '', wins: v.wins, unsure: v.unsure };
        if (v.pick) am.content = v.pick.text;
        else am.content = `I'm not sure about this one. ${tries.length} tries gave ${new Set(tries.map(t => t.key || t.ans)).size === tries.length ? 'different answers' : 'answers that did not agree'}: ${tries.map(t => t.ans || 'no answer').join('; ')}. This is my first try:\n\n` + am.content;
      }
    }
    // a school problem must have all six parts; if some are missing the AI is asked once to write them
    if (playbook === 'math' && am.content && !run.stopped && !answerLoop && finish !== 'length') {
      const missing = solveParts(am.content);
      if (missing.length && missing.length < 6) {
        setWork(am, `Adding the missing ${missing.join(' and ')} part`, null);
        const lastU = built.messages[built.messages.length - 1];
        const fix = await Brain.generate({ messages: built.messages.slice(0, -1).concat([{ role: 'user', content: lastU.content }, { role: 'assistant', content: am.content }, { role: 'user', content: solveRepairMessage(missing) }]),
          think: false, ...samplingFor(false), max_tokens: P.answerMax }).catch(() => null);
        const better = fix ? cleanAnswer(splitStream(fix.text, false).answer).trim() : '';
        if (better && solveParts(better).length < missing.length && !run.stopped) { am.content = better; am.repaired = missing; }
      }
      am.solveMissing = solveParts(am.content);
    }
    if (playbook === 'math' && am.content) am.mathCheck = checkArithmetic(am.content);
    const secs = (performance.now() - t0) / 1000;
    const tps = usage?.extra?.decode_tokens_per_s || 0;
    am.stats = { tps, secs, tokens: usage?.completion_tokens || 0, prompt: usage?.prompt_tokens || built.used, dropped: built.dropped };
    chat.lastPrompt = am.stats.prompt;
    am.playbook = playbook;
    Saver.noteSpeed(tps, am.stats.tokens);
    am.state = run.stopped ? 'stopped' : 'done';
    if (finish === 'length' && !run.stopped && !answerLoop) am.content += '\n\n*(The answer hit the length limit. Ask “continue” for more.)*';
  } catch (e) {
    if (run.stopped || e?.message === 'stopped') am.state = 'stopped';
    else { console.error(e); am.state = 'error'; am.error = friendlyError(e); }
  } finally {
    await endRun(run, t0);
  }
}
async function planQueries(question, prev) {
  const sys = 'You write Wikipedia search queries. Fix spelling mistakes in the question, but keep every name or title as the user wrote it, only corrected for spelling. Say "film" instead of "movie". Do not add names that are not in the question. Reply with one to three search queries, one per line, each two to five words. No numbering and no other text.';
  const user = (prev && isFollowUp(question) ? `Earlier question: ${prev}\n` : '') + `Question: ${question}`;
  const r = await Brain.generate({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }], think: false, temperature: 0.2, top_p: 0.9, presence_penalty: 0, max_tokens: 48 });
  return cleanAnswer(r.text).split('\n').map(s => s.replace(/^[\s\-*\d.)"'“]+|["'”\s]+$/g, '').trim()).filter(s => s && s.length < 70).slice(0, 3);
}
function stopRun() {
  const run = App.run; if (!run) return;
  run.stopped = true;
  try { run.ctl.abort(); } catch {}
  try { run.onStop?.(); } catch {}
  Brain.interrupt();
}

/* Make a chat (if none is open) and add the user's message. Files waiting in the composer move into the chat. */
function addUserMessage(text, opts = {}) {
  let chat = current();
  if (!chat) {
    chat = { id: uid(), title: chatTitleFrom(text), autoTitle: true, created: Date.now(), updated: Date.now(), pinned: false, messages: [] };
    if (App.pendingRole && ROLES[App.pendingRole]) chat.role = App.pendingRole;
    App.pendingRole = '';
    App.chats.push(chat); App.currentId = chat.id;
  }
  const msg = { id: uid(), role: 'user', content: text, created: Date.now() };
  if (opts.noLookup) msg.noLookup = true;
  if (opts.study) { msg.study = opts.study; msg.topic = opts.topic || ''; }
  if (opts.essay) msg.essay = opts.essay;
  if (opts.ovr && Object.keys(opts.ovr).length) msg.ovr = opts.ovr;
  if (opts.cmd) msg.cmd = opts.cmd;
  if (App.pending.length) {
    chat.docs = chat.docs || [];
    msg.attach = [];
    for (const d of App.pending) {
      chat.docs.push(d);
      msg.attach.push({ id: d.id, name: d.name, kind: d.kind, chars: d.chars, pages: d.pages });
    }
    App.pending = []; renderAttachments();
  }
  chat.messages.push(msg);
  drafts.delete(App.currentId); drafts.delete('new');
  els.input.value = ''; autoGrow();
  renderTitle(); renderFiles();
  return { chat, msg };
}
async function send(text, opts = {}) {
  text = (text || '').trim();
  if (!text && App.pending.length) text = 'Summarize the attached ' + (App.pending.length > 1 ? 'files.' : 'file.');
  if (!text) return;
  if (App.run) { toast('Lumen is still answering. Press Stop first.'); return; }
  if (Lab.isBusy()) { toast('The Test lab is using the model. Wait for it to finish, or open the lab and press Cancel.'); return; }
  if (Brain.state === 'unsupported') { toast('This browser cannot run the AI model.'); return; }
  // Lumen learns from what the user says: facts and names are saved, questions show what the user is interested in
  const m = text.match(/^(?:please\s+)?remember(?:\s+that)?[:\s]+(.{3,200})$/i);
  let learned = [], aboutMemory = !!m;
  if (m && !opts.noMemory) { if (addMemory(m[1].trim(), true)) learned = [m[1].trim()]; }
  else if (!opts.noMemory) {
    const f = text.match(/^(?:please\s+)?forget(?:\s+(?:about|that))?\s+(.{3,80})$/i);
    if (f) { Learn.forgetNatural(f[1]); aboutMemory = true; } else learned = Learn.fromMessage(text, opts);
  }
  Learn.noteTurn(opts.study ? opts.topic : text, opts, aboutMemory || learned.length > 0 || !!opts.essay);   // what you say about yourself is not a topic you search for
  const { chat, msg } = addUserMessage(text, opts);
  if (learned.length) msg.learned = learned.slice(0, 3);
  if (aboutMemory) msg.memCmd = true;   // "remember …" / "forget …" talks about Lumen's notes, so it is not a topic to look up later
  await saveChat(chat);
  runFor(chat, msg);
}
/* "Not what you meant?": use another meaning of the same name, and remember the choice. */
function chooseMeaning(chat, m, it) {
  if (App.run) { toast('Wait for the answer to finish, or press Stop.'); return; }
  const a = m.alts;
  const prev = a?.key ? Learn.rememberMeaning(a.key, it.title, a.label) : undefined;
  if (a?.key && S.learn.topics) toast(`Got it. “${clip(a.label || a.key, 30)}” now means ${clip(it.title, 40)}.`, { label: 'Undo', run: () => Learn.restoreMeaning(a.key, prev) });
  regenerate(chat, m, { pick: { title: it.title } });
}
function regenerate(chat, am, ovr) {
  if (App.run) return;
  const i = chat.messages.indexOf(am);
  if (i < 0) return;
  // a finished answer is kept as another version; a failed or empty one is just replaced
  if (am.state !== 'error' && (am.content || am.widget)) chat._pendingFork = forkAt(chat, i); else chat.messages.splice(i);
  const lastUser = [...chat.messages].reverse().find(m => m.role === 'user');
  if (!lastUser) { chat._pendingFork = null; renderThread(); return; }
  chat.messages.splice(chat.messages.indexOf(lastUser) + 1);
  if (ovr) lastUser.ovr = { ...(lastUser.ovr || {}), ...ovr };
  runFor(chat, lastUser);
}
function runFor(chat, msg) { return msg.essay ? runEssay(chat, msg) : msg.study ? runStudy(chat, msg, msg.study, msg.topic || '') : runTurn(chat, msg); }
function resendEdited(chat, um, text) {
  text = (text || '').trim(); if (!text || App.run) return;
  const i = chat.messages.indexOf(um);
  if (i < 0) return;
  um._editing = false;
  if (text === (um.content || '').trim()) {
    // nothing changed: this is the same as asking again
    const next = chat.messages[i + 1];
    if (next?.role === 'assistant') return regenerate(chat, next);
    renderThread(); return runFor(chat, um);
  }
  let target = um;
  if (i < chat.messages.length - 1) {
    // a new version of this message; the old message and everything after it stay as the other version
    target = { ...um, id: uid(), content: text, created: Date.now() };
    delete target._editing; delete target.learned; delete target.memCmd; delete target.fork;
    target.fork = forkAt(chat, i);
    chat.messages.push(target);
  } else um.content = text;
  if (chat.autoTitle && chat.messages.find(m => m.role === 'user') === target) { chat.title = chatTitleFrom(text); renderTitle(); }
  const sl = parseSlash(text);
  target.study = sl && ['quiz', 'cards', 'slides'].includes(sl.cmd) ? sl.cmd : undefined;
  target.topic = target.study ? sl.arg : undefined;
  saveChat(chat);
  runFor(chat, target);
}

/* ---------- versions: editing a question or asking again keeps the old version, and arrows switch between them ----------
   chat.messages is always the version you are looking at (so everything else in Lumen keeps working).
   The other versions wait in chat.forks[id].versions[k].msgs, from the "head" message on (the message that has fork: id).
   Old chats have no forks, so they are not changed at all. */
const FORK_MAX = 12;
/* Take the messages from position i to the end out of the chat and keep them as a version. Returns the fork id; the caller adds the new head. */
function forkAt(chat, i) {
  const head = chat.messages[i];
  if (!head) return null;
  chat.forks = chat.forks || {};
  let id = head.fork, f = id && chat.forks[id];
  if (!f) { id = uid(); head.fork = id; f = chat.forks[id] = { active: 0, versions: [{ msgs: null }] }; }
  f.versions[f.active].msgs = chat.messages.splice(i);
  f.versions.push({ msgs: null }); f.active = f.versions.length - 1;
  if (f.versions.length > FORK_MAX) { f.versions.splice(0, 1); f.active--; toast('The oldest version of this message was removed (up to ' + FORK_MAX + ' are kept).'); }
  forkTip();
  return id;
}
/* A one-time tip. It never covers another message: if a toast is showing, it waits until that one is gone. */
function forkTip(tries = 0) {
  try {
    if (localStorage.getItem('lumen.forkTip')) return;
    if (els.toast.classList.contains('show')) { if (tries < 3) setTimeout(() => forkTip(tries + 1), 4600); return; }
    localStorage.setItem('lumen.forkTip', '1');
    toast('Both versions are kept. Use the arrows to switch. You can save a safety copy of your chats too.', { label: 'Save a backup', run: () => exportAll() });
  } catch {}
}
function forkInfo(chat, m) {
  const f = m.fork && chat.forks?.[m.fork];
  return f && f.versions.length > 1 ? { id: m.fork, n: f.versions.length, at: f.active } : null;
}
/* Show another version: the current messages go back into their slot and the chosen ones come out. */
function switchFork(chat, id, k) {
  if (App.run) { toast('Wait for the answer to finish, or press Stop.'); return; }
  const f = chat.forks?.[id];
  if (!f || k < 0 || k >= f.versions.length || k === f.active) return;
  const next = f.versions[k].msgs;
  const i = chat.messages.findIndex(m => m.fork === id);
  if (i < 0 || !Array.isArray(next) || !next.length) return;
  f.versions[f.active].msgs = chat.messages.splice(i);
  chat.messages.push(...next);
  f.versions[k].msgs = null; f.active = k;
  Speech.stop();
  saveChat(chat);
  renderThread(); updateMeter();
}
/* The small "‹ 2/3 ›" control. */
function forkNav(chat, m) {
  const fi = forkInfo(chat, m);
  if (!fi) return null;
  const b = (txt, label, to) => h('button', { type: 'button', class: 'fork-b', 'aria-label': label, title: label, text: txt, disabled: to < 0 || to >= fi.n ? true : null, onclick: () => switchFork(chat, fi.id, to) });
  return h('span', { class: 'fork-nav', role: 'group', 'aria-label': 'Versions of this message' }, b('‹', 'Previous version', fi.at - 1), h('span', { class: 'fork-n', text: `${fi.at + 1}/${fi.n}` }), b('›', 'Next version', fi.at + 1));
}

/* ---------- adding files and web pages to a chat ---------- */
const MAX_FILES = 12;
const KIND_ICON = { pdf: 'file', docx: 'file', pptx: 'slides', xlsx: 'columns', web: 'globe', paste: 'text' };
const kindLabel = d => d.kind === 'web' ? 'web page' : d.kind === 'paste' ? 'pasted text' : (d.kind || 'text').toUpperCase();
const docInfo = d => [d.pages ? `${d.pages} page${d.pages === 1 ? '' : 's'}` : '', `${Math.max(1, Math.round(d.chars / 5.7)).toLocaleString('en-US')} words`].filter(Boolean).join(', ');
const chatDocChars = () => (current()?.docs || []).reduce((s, d) => s + d.chars, 0) + App.pending.reduce((s, d) => s + (d.chars || 0), 0);

async function addFiles(list) {
  const files = [...list];
  if (!files.length) return;
  for (const f of files.slice(0, 8)) {
    if (App.pending.length + (current()?.docs?.length || 0) >= MAX_FILES) { toast(`A chat can hold up to ${MAX_FILES} files. Remove one first.`); break; }
    if (chatDocChars() > DOC_LIMITS.chat) { toast('This chat already holds a lot of text. Remove a file first.'); break; }
    const slot = { id: uid(), name: f.name || 'file', loading: true, progress: 0, kind: '' };
    App.pending.push(slot); renderAttachments();
    try {
      const d = await readFileText(f, p => { slot.progress = p; renderAttachments(); });
      Object.assign(slot, d, { loading: false, added: Date.now() });
      if (d.truncated) toast(`“${clip(d.name, 30)}” is very long, so Lumen kept the first ${Math.round(DOC_LIMITS.chars / 1000)}K characters.`);
    } catch (e) {
      App.pending = App.pending.filter(x => x !== slot);
      toast(e?.message || 'That file could not be read.', null, 6500);
    }
    renderAttachments(); updateComposer();
  }
}
function addPendingText(name, text, kind) {
  const t = text.replace(/\r\n?/g, '\n').trim().slice(0, DOC_LIMITS.chars);
  App.pending.push({ id: uid(), name, kind, text: t, chars: t.length, pages: 0, added: Date.now() });
  renderAttachments(); updateComposer();
}

/* ----- the chips above the message box ----- */
function renderAttachments() {
  const row = els.attRow;
  row.replaceChildren();
  row.hidden = !App.pending.length;
  for (const d of App.pending) {
    const chip = h('div', { class: 'att' + (d.loading ? ' loading' : ''), title: d.loading ? 'Reading…' : `${d.name} (${docInfo(d)})` },
      h('span', { class: 'ai', html: d.loading ? '<span class="spin"></span>' : icon(KIND_ICON[d.kind] || 'file', 16) }),
      h('span', { class: 'an' }, h('b', { text: clip(d.name, 34) }), h('i', { text: d.loading ? (d.progress ? `Reading ${Math.round(d.progress * 100)}%` : 'Reading…') : `${kindLabel(d)} · ${docInfo(d)}` })),
      iconButton('x', 'Remove ' + d.name, () => { App.pending = App.pending.filter(x => x !== d); renderAttachments(); updateComposer(); }, 'icon-btn tiny'));
    row.append(chip);

/* ----- the files already in this chat ----- */
function renderFiles() {
  const c = current(), n = c?.docs?.length || 0;
  els.filesBtn.hidden = !n;
  els.filesBtn.title = els.filesBtn.ariaLabel = `${n} file${n === 1 ? '' : 's'} in this chat`;
  els.filesBtn.innerHTML = icon('file', 18) + (n ? `<span class="badge">${n}</span>` : '');
}
function showFilesMenu() {
  const c = current(); if (!c?.docs?.length) return;
  const groups = [{ title: 'Files Lumen can read in this chat', items: c.docs.map(d => ({ icon: KIND_ICON[d.kind] || 'file', label: clip(d.name, 40), desc: `${kindLabel(d)} · ${docInfo(d)}${d.truncated ? ' · cut short' : ''}`, tail: icon('trash', 15), run: () => removeDoc(c, d) })) },
    { items: [{ icon: 'plus', label: 'Add another file', run: () => els.fileInput.click() }] }];
  showActions(els.filesBtn, 'Files', groups, { below: true, right: true });
}
function removeDoc(chat, d) {
  chat.docs = chat.docs.filter(x => x !== d);
  if (!chat.docs.length) delete chat.docs;
  saveChat(chat); renderFiles(); renderThread();
  toast(`Removed “${clip(d.name, 30)}”.`, { label: 'Undo', run: () => { chat.docs = [...(chat.docs || []), d]; saveChat(chat); renderFiles(); renderThread(); } });
}

/* ----- web pages (read through Jina Reader, only after the user agrees) ----- */
const URL_RE = /\bhttps?:\/\/[^\s<>"')\]]+/gi;
async function readerAllowed(url) {
  if (S.reader === 'never') { toast('Reading web pages is turned off in Settings.'); return false; }
  if (S.reader === 'allow') return true;
  const r = await askDialog({ title: 'Read this web page?', text: `To read ${domainOf(url) || 'this page'}, Lumen sends its address to r.jina.ai, a free service that turns web pages into plain text. Nothing else from your chat is sent.`, ok: 'Read the page', cancel: 'Not now', check: 'Always allow this (you can change it in Settings)' });
  if (r.ok && r.checked) { S.reader = 'allow'; saveSettings(); }
  return r.ok;
}
async function addLink(url, consented) {
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url); } catch { toast('That does not look like a web address.'); return false; }
  if (!consented && !(await readerAllowed(url))) return false;
  const slot = { id: uid(), name: domainOf(url), loading: true, progress: 0, kind: 'web' };
  App.pending.push(slot); renderAttachments();
  try {
    const p = await readPage(url);
    const text = p.text.slice(0, DOC_LIMITS.chars);
    Object.assign(slot, { name: clip(p.title || domainOf(url), 60), url, kind: 'web', text, chars: text.length, pages: 0, loading: false, added: Date.now() });
  } catch (e) {
    App.pending = App.pending.filter(x => x !== slot);
    toast(e?.paused ? 'The page reader is paused for a few minutes after errors.' : (e?.off ? 'The page reader is turned off in Settings.' : 'Lumen could not read that page. It may need a login, or block readers.'), null, 6500);
    renderAttachments(); return false;
  }
  renderAttachments(); updateComposer();
  return true;
}
/* A link inside a message: offer to read it before sending. */
async function maybeReadLinks(text) {
  const urls = [...new Set(text.match(URL_RE) || [])].slice(0, 2);
  if (!urls.length || S.reader === 'never') return;
  const have = new Set([...(current()?.docs || []), ...App.pending].map(d => d.url).filter(Boolean));
  for (const u of urls) {
    if (have.has(u)) continue;
    if (S.reader === 'ask') {
      const r = await askDialog({ title: 'Read the link in your message?', text: `Lumen can read ${domainOf(u)} so it can answer about it. To do that it sends the link to r.jina.ai, a free page-reading service.`, ok: 'Read the page', cancel: 'Just send', check: 'Always do this (you can change it in Settings)' });
      if (!r.ok) return;
      if (r.checked) { S.reader = 'allow'; saveSettings(); }
    }
    await addLink(u, true);
  }
}

/* ----- wiring: the file picker, drag and drop, and paste ----- */
els.fileInput.addEventListener('change', () => { addFiles(els.fileInput.files); els.fileInput.value = ''; });
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; els.dropzone.hidden = false; });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) els.dropzone.hidden = true; });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; els.dropzone.hidden = true;
  if (els.settings.open) return;
  addFiles(e.dataTransfer.files);
});
els.input.addEventListener('paste', e => {
  const files = e.clipboardData?.files;
  if (files?.length) { e.preventDefault(); addFiles(files); return; }
  const text = e.clipboardData?.getData('text/plain') || '';
  // A long paste becomes a file, so the whole text can be read in parts instead of being cut off.
  if (text.length > 6000 && !/^\s*\//.test(els.input.value)) {
    e.preventDefault();
    addPendingText(`Pasted text (${Math.round(text.length / 5.7).toLocaleString('en-US')} words)`, text, 'paste');
    toast('Long text was added as a file so Lumen can read all of it. Type what you want to do with it.');
  }
});
els.filesBtn.addEventListener('click', showFilesMenu);

/* ---------- Test lab: numbers instead of guesses (model test, quick check, speed, prompt A/B, examples A/B, voting test) ----------
   Every test runs the real Lumen prompt on the model that is loaded, at temperature 0 with a fixed seed, in Fast mode, with no web look-up,
   so two runs can be compared. Questions: lab-questions.json (50 + 20 puzzles). Nothing leaves the computer. */
const LabScore = {
  plain: t => String(t || '').replace(/```[\s\S]*?```/g, ' ').replace(/[*_#>`|]/g, ' ').replace(/\s+/g, ' ').trim(),
  words: t => String(t || '').match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g) || [],
  sentences: t => String(t || '').replace(/\s*\n+\s*/g, ' ').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => /[A-Za-z0-9]/.test(s)),
  readability(t) {
    const w = this.words(t), s = this.sentences(t);
    return w.length && s.length ? { sentLen: w.length / s.length, wordLen: w.join('').length / w.length } : { sentLen: 0, wordLen: 0 };
  },
  /* The number the answer ends with (the "Answer:" line when there is one). */
  finalNumber(t) {
    const s = String(t || '').replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/[−–]/g, '-');
    const ans = [...s.matchAll(/(?:final answer|answer)\s*[:=\-]\s*([^\n]+)/gi)].pop();
    const nums = x => (x.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    const a = ans ? nums(ans[1]) : [];
    if (a.length) return a[0];
    const all = nums(s.slice(-200));
    return all.length ? all[all.length - 1] : null;
  },
  rule(rule, text) {
    const [kind, arg] = rule, t = String(text || '').trim();
    switch (kind) {
      case 'sentences': return this.sentences(t).length === arg;
      case 'lines': return t.split('\n').filter(l => l.trim()).length === arg;
      case 'numbered': return t.split('\n').filter(l => /^\s*\d+[.)]\s+\S/.test(l)).length === arg;
      case 'maxWords': return this.words(t).length <= arg;
      case 'contains': return new RegExp('\\b' + arg + '\\b', 'i').test(t);
      case 'noComma': return !t.includes(',');
      case 'starts': return new RegExp('^\\W*' + arg, 'i').test(t);
      case 'full': return new RegExp(arg, /[A-Z]/.test(arg.replace(/\\[A-Za-z]/g, '')) ? '' : 'i').test(t);
    }
    return false;
  },
  /* Score one answer from 1 to 5. Facts, math and honesty are right or wrong (5 or 1); writing counts the rules it followed;
     an explanation gets the average of clearness, accuracy and own words. */
  answer(q, text, copyN = 0) {
    const t = String(text || '').trim(), rx = (s, f = 'i') => new RegExp(s, f);
    if (q.cat === 'facts') { const p = (q.re || []).some(r => rx(r).test(t)); return { score: p ? 5 : 1, pass: p, parts: { accurate: p ? 5 : 1 } }; }
    if (q.cat === 'honest') { const p = (q.good || []).some(r => rx(r).test(t)); return { score: p ? 5 : 1, pass: p, parts: { accurate: p ? 5 : 1 } }; }
    if (q.cat === 'math') { const n = this.finalNumber(t), p = n !== null && Math.abs(n - Number(q.ans)) < 1e-6; return { score: p ? 5 : 1, pass: p, parts: { accurate: p ? 5 : 1 } }; }
    if (q.cat === 'write') {
      const ok = (q.rules || []).map(r => this.rule(r, t)), n = ok.filter(Boolean).length;
      const score = Math.round((1 + 4 * n / Math.max(1, ok.length)) * 10) / 10;
      return { score, pass: n === ok.length, parts: { accurate: score } };
    }
    // explanation
    const w = this.words(t), hits = (q.terms || []).filter(r => rx(r).test(t)).length, need = q.need || 2;
    const rd = this.readability(this.plain(t));
    const easy = rd.sentLen > 0 && rd.sentLen <= 20 && rd.wordLen <= 5.3;
    const example = /\b(for example|for instance|such as|imagine|think of|like a|is like|as if|picture)\b/i.test(t);
    const size = w.length >= 40 && w.length <= 320;
    const clear = 1 + 4 * ((easy ? 1 : 0) + (example ? 1 : 0) + (size ? 1 : 0)) / 3;
    const accurate = hits >= need ? 5 : 1 + 4 * (hits / need);
    const own = copyN >= 8 ? 2 : 5;
    return { score: Math.round((clear + accurate + own) / 3 * 100) / 100, pass: hits >= need, parts: { clear: +clear.toFixed(2), accurate: +accurate.toFixed(2), own } };
  },
};

const Lab = (() => {
  const KEY = 'lumen.lab', SEED = 42, MAXRUNS = 16;
  let st = { runs: [], baseline: {}, queue: null };
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || '{}');
    st = { runs: Array.isArray(v.runs) ? v.runs.slice(0, MAXRUNS) : [], baseline: v.baseline && typeof v.baseline === 'object' ? v.baseline : {}, queue: v.queue && typeof v.queue === 'object' ? v.queue : null };
  } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch { try { st.runs = st.runs.slice(0, 4); localStorage.setItem(KEY, JSON.stringify(st)); } catch {} } };
  const live = { busy: false, status: '', progress: 0, cancel: false };
  const subs = new Set();
  const emit = () => { subs.forEach(f => { try { f(); } catch {} }); paintBar(); try { Dictation.sync(); } catch {} };
  const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  const med = a => { const s = a.filter(Number.isFinite).sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  const r1 = n => Math.round(n * 10) / 10, r2 = n => Math.round(n * 100) / 100;

/* ---------- composer ---------- */
function autoGrow() { const t = els.input; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.38) + 'px'; }
function updateComposer() {
  const busy = !!App.run;
  els.main.classList.toggle('is-working', busy);
  els.send.classList.toggle('stop', busy);
  els.send.innerHTML = busy ? icon('stop', 18) : icon('up', 18);
  els.send.setAttribute('aria-label', busy ? 'Stop' : 'Send');
  els.send.title = busy ? 'Stop (Esc)' : 'Send (' + (S.sendKey === 'mod' ? MOD + ' + Enter' : 'Enter') + ')';
  Dictation.sync();
  const loading = App.pending.some(d => d.loading);
  els.send.disabled = !busy && ((!els.input.value.trim() && !App.pending.filter(d => !d.loading).length) || loading || Brain.state === 'unsupported');
  els.input.placeholder = Brain.state === 'unsupported' ? 'This browser can’t run the AI model'
    : App.pending.length ? 'What should Lumen do with the file? (or just send it to get a summary)'
    : (current()?.messages.length ? 'Reply to Lumen…' : 'How can I help you learn today?  Type / for commands');
}
/* The memory meter: how much of the AI's short-term memory the next message would use. */
function updateMeter() {
  const c = current();
  const ctx = ctxNow();
  const hist = c?.lastPrompt || (c?.messages || []).reduce((s, m) => s + estTokens(m.content), 0);
  const used = hist + (els.input.value ? estTokens(els.input.value) : 0);
  const pct = Math.min(100, Math.round(used / (ctx * 0.6) * 100));
  els.meter.querySelector('i').style.width = pct + '%';
  els.meter.querySelector('.mtxt').textContent = pct >= 100 ? 'Full' : pct + '%';
  els.meter.classList.toggle('high', pct >= 75);
  const words = Math.round(ctx * 0.6 * 0.75 / 500) * 500;
  els.meter.title = `Lumen can hold about ${words.toLocaleString('en-US')} words of this chat in mind at once. ` + (c?.summary ? 'Older messages were squeezed into a short summary so the important parts are not lost. ' : 'When this fills up, older messages are squeezed into a short summary. ') + 'Start a new chat for a new topic.';
}
els.input.addEventListener('input', () => { autoGrow(); updateComposer(); updateMeter(); updateSlash(); });
els.input.addEventListener('keydown', e => {
  if (handleSlashKey(e)) return;
  if (e.key === 'Enter' && !e.isComposing) {
    const send = S.sendKey === 'mod' ? (e.ctrlKey || e.metaKey) : !e.shiftKey;   // "Send with": Enter, or Ctrl/⌘ + Enter (then Enter makes a new line)
    if (send) { e.preventDefault(); if (!App.run) submitComposer(); }
  }
});
els.input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== els.input && !els.slashMenu.contains(document.activeElement)) hideSlash(); }, 120));
els.composer.addEventListener('submit', e => { e.preventDefault(); if (App.run) stopRun(); else submitComposer(); });

function startCommand(text) {

/* ---------- slash commands, memory, and the one place every message goes through ---------- */
function parseSlash(text) {
  const m = (text || '').trim().match(/^\/([a-z]+)(?:\s+([\s\S]*))?$/i);
  if (!m) return null;
  const cmd = m[1].toLowerCase();
  return SLASH.some(s => s.cmd === cmd) ? { cmd, arg: (m[2] || '').trim() } : null;
}

/* ----- memory: short facts about the user, kept on this computer and added to every prompt ----- */
function addMemory(text, fromChat, extra) {
  const r = Learn.saveFact(text, extra);
  if (r.error === 'short') return false;
  if (r.error === 'dup') { toast('Already in memory.'); return false; }
  if (r.error === 'full') { toast(`Memory is full (${MEM_MAX} facts). Remove one in Settings first.`); return false; }
  Learn.notify();
  toast(`${r.old ? 'Updated' : 'Saved to memory'}: “${clip(r.item.text, 50)}”`, { label: 'Undo', run: () => Learn.undoFact(r) });
  return true;
}
function forgetMemory(query) {
  const q = query.toLowerCase();
  const gone = S.memory.filter(m => m.text.toLowerCase().includes(q));
  if (!gone.length) { toast('Nothing in memory matches that.'); return; }
  S.memory = S.memory.filter(m => !gone.includes(m)); saveSettings();
  toast(`Forgot ${gone.length === 1 ? '“' + clip(gone[0].text, 40) + '”' : gone.length + ' facts'}.`, { label: 'Undo', run: () => { S.memory.push(...gone); saveSettings(); } });
}

const Speech = {
  id: null,

  voice() {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.voiceURI === S.speechVoice) || vs.find(v => /^en[-_]/i.test(v.lang) && v.localService) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  toggle(m) { if (this.id === m.id) this.stop(); else this.speak(m); },
  stop() {
    const was = this.id; this.id = null;
    try { speechSynthesis.cancel(); } catch {}
    if (was) this.refresh(was);
  },
  refresh(id) {
    const c = current(), m = c?.messages.find(x => x.id === id), n = m && nodeFor(m);
    if (n) fillAssistant(n, m, c);
  },
  speak(m) {
    if (!this.supported) { toast('This browser cannot read text aloud.'); return; }
    this.stop();
    const parts = speechChunks(plainText(m.content));
    if (!parts.length) return;
    this.id = m.id; this.refresh(m.id);
