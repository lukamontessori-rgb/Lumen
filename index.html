<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="A private AI tutor that runs inside your browser.">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1D1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232E6B66'/%3E%3Ccircle cx='15' cy='17' r='7.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='21.5' cy='10.5' r='3' fill='%23E0A558'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css" media="print" onload="this.media='all'">
<style>
/* Layout: a calm reading room. A quiet history rail on the left, one reading column in a bookish serif,
   and a large writing card that sits in the middle of a new chat and docks at the bottom once you start. */
:root {
  --bg: #FAF8F3;
  --rail: #F3F0E8;
  --surface: #FFFFFF;
  --surface-2: #EFEBE2;
  --hover: #E9E5DB;
  --ink: #24221D;
  --ink-2: #4B473F;
  --muted: #7B7569;
  --line: #E4DFD4;
  --line-2: #D5CFC2;
  --accent: #2E6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1ECE8;
  --lamp: #B8742A;
  --lamp-soft: #F5EADA;
  --danger: #B3261E;
  --danger-soft: #FBEAE7;
  --ok: #2F7D4F;
  --code-bg: #F4F1EA;
  --shadow-card: 0 1px 2px rgba(60, 48, 25, .05), 0 8px 28px -12px rgba(60, 48, 25, .20);
  --shadow-pop: 0 14px 44px -14px rgba(40, 32, 18, .36), 0 0 0 1px rgba(40, 32, 18, .06);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: ui-serif, "Iowan Old Style", Charter, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1D1A; --rail: #191815; --surface: #2A2824; --surface-2: #34312B; --hover: #3A372F;
    --ink: #ECE8DF; --ink-2: #CCC6B9; --muted: #9C9689; --line: #3A372F; --line-2: #4A463C;
    --accent: #74B8AF; --accent-ink: #10201E; --accent-soft: #25332F; --lamp: #E0A558; --lamp-soft: #3A2F20;
    --danger: #F2867B; --danger-soft: #3D1F1B; --ok: #62C28A; --code-bg: #232120;
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.55);
    --shadow-pop: 0 16px 48px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1D1A; --rail: #191815; --surface: #2A2824; --surface-2: #34312B; --hover: #3A372F;
  --ink: #ECE8DF; --ink-2: #CCC6B9; --muted: #9C9689; --line: #3A372F; --line-2: #4A463C;
  --accent: #74B8AF; --accent-ink: #10201E; --accent-soft: #25332F; --lamp: #E0A558; --lamp-soft: #3A2F20;
  --danger: #F2867B; --danger-soft: #3D1F1B; --ok: #62C28A; --code-bg: #232120;
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-pop: 0 16px 48px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.ic .fill { fill: currentColor; stroke: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 500 11px/1 var(--font-ui); color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; background: var(--surface); }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; transition: grid-template-columns .22s ease; }
.app.rail-off { grid-template-columns: 0 minmax(0, 1fr); }
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-height: 0; min-width: 0; overflow: hidden; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.app.rail-off .rail { padding-left: 0; padding-right: 0; border-right: 0; }
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 8px 6px; }
.brand { display: flex; align-items: center; gap: 9px; font: 600 18px/1 var(--font-serif); letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; padding: 0; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.rail-new { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 8px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
.rail-new:hover { background: var(--hover); }
.rail-new .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.rail-new kbd { margin-left: auto; }
.search { position: relative; margin: 2px 0 4px; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 7px 10px 7px 34px; font-size: 14px; outline: none; }
.search input:hover { background: var(--hover); }
.search input:focus { background: var(--surface); border-color: var(--line-2); }
.chat-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px 8px; }
.group-label { font: 600 11.5px/1 var(--font-ui); color: var(--muted); padding: 16px 8px 6px; }
.chat-item { display: flex; align-items: center; border-radius: 9px; position: relative; }
.chat-item:hover, .chat-item:focus-within { background: var(--hover); }
.chat-item[aria-current="true"] { background: var(--hover); }
.chat-item[aria-current="true"] .chat-open { color: var(--ink); font-weight: 550; }
.chat-open { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.chat-open .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-open .pin { color: var(--lamp); }
.chat-open .live { width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); animation: pulse 1.1s ease-in-out infinite; flex: none; }
.chat-acts { display: none; }
.chat-item:hover .chat-acts, .chat-item:focus-within .chat-acts { display: flex; }
.chat-acts .icon-btn { width: 28px; height: 28px; }
.chat-acts .icon-btn:hover { background: var(--surface-2); }
.rename { flex: 1; min-width: 0; margin: 3px; border: 1px solid var(--accent); border-radius: 7px; padding: 4px 7px; background: var(--surface); font-size: 13.5px; outline: none; }
.list-empty { color: var(--muted); font-size: 13px; padding: 14px 8px; }
.rail-foot { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.rail-model { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 7px 8px; border-radius: 10px; text-align: left; }
.rail-model:hover { background: var(--hover); }
.rail-model .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.rail-model .st { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-model > span:last-child { min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ready { background: var(--ok); }
.dot.busy { background: var(--lamp); animation: pulse 1.2s ease-in-out infinite; }
.dot.error { background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; position: relative; }
.topbar { display: flex; align-items: center; gap: 6px; padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 6px; min-height: 52px; }
.topbar h1 { flex: 1; min-width: 0; margin: 0; font: 500 14px/1.3 var(--font-ui); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.menu-btn { display: none; }
.app.rail-off .menu-btn { display: grid; }
.top-right { display: flex; align-items: center; gap: 4px; }
.model-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 12.5px; font-weight: 550; color: var(--ink-2); max-width: 46vw; }
.model-chip:hover { background: var(--hover); }
.model-chip .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; }
.column { width: 100%; max-width: 760px; margin: 0 auto; padding: 4px 24px 32px; }
.jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 148px; z-index: 5; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; box-shadow: var(--shadow-card); }

/* ---------- welcome ---------- */
.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 8px 24px 12vh; }
.greet { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; font: 400 clamp(30px, 4.4vw, 42px)/1.12 var(--font-serif); letter-spacing: -.015em; color: var(--ink); text-align: center; text-wrap: balance; }
.greet svg { width: clamp(30px, 3.6vw, 38px); height: auto; flex: none; }
.welcome-slot { width: min(720px, 100%); }
.banner { width: min(720px, 100%); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.banner .bi { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 3px; }
.banner h3 { margin: 0; font: 600 14.5px/1.35 var(--font-ui); display: flex; align-items: center; gap: 8px; }
.banner p { margin: 0; color: var(--muted); font-size: 13px; }
.banner .row { display: flex; gap: 6px; flex-wrap: wrap; }
.banner.warn { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.banner .bar { width: 100%; margin-top: 6px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.progress-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(720px, 100%); }
.chips button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; }
.chips button:hover { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.chips .ic { color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 7px 12px; font-weight: 550; font-size: 13.5px; line-height: 1.2; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- composer ---------- */
.composer { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-card); transition: border-color .15s, box-shadow .15s; }
.composer:focus-within { border-color: var(--line-2); }
.composer textarea { display: block; width: 100%; border: 0; resize: none; background: transparent; padding: 16px 18px 4px; font-size: 16px; line-height: 1.55; max-height: 38vh; min-height: 52px; outline: none; }
.main.is-empty .composer textarea { min-height: 76px; }
.composer textarea::placeholder { color: var(--muted); }
.c-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 10px 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 550; white-space: nowrap; }
.pill:hover, .pill[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); }
.pill .chev { color: var(--muted); margin-right: -3px; }
.pill.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); }
.pill .sub { color: var(--muted); font-weight: 500; }
.pill.on .sub { color: inherit; opacity: .8; }
.c-end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.meter { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .mbar { width: 36px; height: 4px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter .mbar i { display: block; height: 100%; background: var(--muted); width: 0; }
.meter.high .mbar i { background: var(--lamp); }
.send { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); border: 0; display: grid; place-items: center; flex: none; transition: background .15s, opacity .15s; }
.send:disabled { background: var(--line-2); color: var(--surface); cursor: default; }
.send.stop { background: var(--ink); color: var(--bg); }
.dock { padding: 4px 24px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock-inner { max-width: 760px; margin: 0 auto; }
.fineprint { max-width: 760px; margin: 7px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }

/* ---------- menus ---------- */
.menu { position: fixed; z-index: 60; width: 290px; max-width: calc(100vw - 16px); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.menu-title { font: 600 11.5px/1 var(--font-ui); color: var(--muted); padding: 8px 10px 6px; }
.menu button { display: grid; grid-template-columns: 18px minmax(0, 1fr) 16px; gap: 1px 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; border: 0; background: transparent; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu .mi { color: var(--muted); }
.menu .t { font-weight: 600; font-size: 14px; }
.menu .ck { color: var(--accent); }
.menu .d { grid-column: 2; color: var(--muted); font-size: 12.5px; line-height: 1.35; }

/* ---------- messages ---------- */
.msg { margin: 26px 0; }
.msg-user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.bubble { background: var(--surface-2); padding: 10px 16px; border-radius: 20px; max-width: min(82%, 600px); white-space: pre-wrap; overflow-wrap: anywhere; font-size: calc(15.5px * var(--tscale, 1)); line-height: 1.55; }
.msg-user .row-acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.msg-user:hover .row-acts, .msg-user:focus-within .row-acts { opacity: 1; }
.edit-box { width: min(100%, 620px); display: flex; flex-direction: column; gap: 8px; }
.edit-box textarea { width: 100%; min-height: 90px; border: 1px solid var(--line-2); border-radius: 16px; padding: 10px 14px; background: var(--surface); resize: vertical; outline: none; font-size: 15.5px; }
.edit-box .row { display: flex; gap: 8px; justify-content: flex-end; }

.msg-ai { display: flex; flex-direction: column; gap: 10px; }
.work { display: flex; align-items: center; gap: 12px; min-height: 26px; font-size: 14px; color: var(--muted); min-width: 0; }
.work .lampmark { width: 18px; height: 18px; flex: none; position: relative; }
.work .lampmark::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--accent); }
.work .lampmark::after { content: ""; position: absolute; width: 6px; height: 6px; top: 0; right: 0; border-radius: 50%; background: var(--lamp); animation: pulse 1.1s ease-in-out infinite; }
.work .wbar { position: relative; width: 108px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; flex: none; }
.work .wbar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--lamp); border-radius: 4px; transition: width .45s ease; }
.work .wbar.indet i { width: 36%; animation: slide 1.15s ease-in-out infinite; transition: none; }
@keyframes slide { from { left: -36%; } to { left: 100%; } }
.work .wt { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fadein .35s ease; }
.work .ws { font-variant-numeric: tabular-nums; flex: none; }
@keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

.thought { align-self: flex-start; max-width: 100%; }
.thought summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; cursor: pointer; padding: 2px 6px 2px 0; border-radius: 6px; }
.thought summary::-webkit-details-marker { display: none; }
.thought summary:hover { color: var(--ink-2); }
.thought summary .ic { transition: transform .15s; transform: rotate(-90deg); }
.thought[open] summary .ic { transform: none; }
.thought .tbody { margin-top: 8px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line-2); color: var(--muted); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow-y: auto; }

.md { font-family: var(--font-serif); font-size: calc(17px * var(--tscale, 1)); line-height: 1.7; overflow-wrap: anywhere; min-width: 0; color: var(--ink); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .85em; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--font-serif); font-weight: 600; line-height: 1.3; margin: 1.3em 0 .45em; letter-spacing: -.005em; }
.md h1 { font-size: 1.3em; } .md h2 { font-size: 1.17em; } .md h3 { font-size: 1.05em; } .md h4 { font-size: 1em; }
.md ul, .md ol { margin: 0 0 .9em; padding-left: 1.4em; }
.md li { margin: .28em 0; }
.md li > p { margin: 0 0 .4em; }
.md li::marker { color: var(--muted); }
.md strong { font-weight: 650; }
.md blockquote { margin: 0 0 .9em; padding: .1em 1em; border-left: 3px solid var(--line-2); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
.md a { text-decoration-thickness: 1px; text-underline-offset: 2px; }
.md :not(pre) > code { font-family: var(--font-mono); font-size: .82em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: .08em .35em; }
.md .table-wrap { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--line); border-radius: 12px; }
.md table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md tr:last-child td { border-bottom: 0; }
.md th { background: var(--surface-2); font-weight: 600; }
.md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: .6em 0 1em; }
.md .katex { font-size: 1.04em; }
.codeblock { margin: 0 0 1em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.codeblock .cb-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); font: 600 12px/1 var(--font-ui); color: var(--muted); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
.codeblock code { font-family: var(--font-mono); font-size: 13px; line-height: 1.55; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-literal { color: var(--accent); font-weight: 600; }
.hljs-string, .hljs-attr, .hljs-template-tag, .hljs-regexp { color: var(--lamp); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--danger); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--muted); font-style: italic; }
.hljs-title, .hljs-section, .hljs-name, .hljs-type { color: var(--ok); font-weight: 600; }
.cite { font: 600 10.5px/1 var(--font-ui); vertical-align: super; margin: 0 1px; }
.cite a { text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 4px; }
.caret::after { content: ""; display: inline-block; width: .45em; height: 1em; vertical-align: -.12em; margin-left: 3px; background: var(--lamp); border-radius: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.note { color: var(--muted); font-style: italic; font-size: 15px; }
.error-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.error-box b { color: var(--danger); }

.sources { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.src { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12.5px; color: var(--ink-2); text-decoration: none; max-width: 100%; }
.src:hover { border-color: var(--line-2); color: var(--ink); }
.src .n { width: 19px; height: 19px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 10.5px; flex: none; }
.src .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.src.plain { padding: 3px 10px; color: var(--muted); background: transparent; }
.src .w { font: 700 11px/1 var(--font-serif); color: var(--muted); }

.msg-foot { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-top: -2px; }
.msg-foot .icon-btn { width: 30px; height: 30px; }
.msg-foot .meta { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-left: 8px; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; margin-left: 6px; }
.chip-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--ink-2); }
.chip-btn:hover { background: var(--hover); color: var(--ink); }

/* ---------- settings ---------- */
dialog.sheet { border: 0; border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(660px, calc(100vw - 32px)); max-height: min(86vh, 900px); box-shadow: var(--shadow-pop); }
dialog.sheet::backdrop { background: rgba(30, 24, 14, .38); }
.sheet-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px 24px; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font: 500 22px/1.2 var(--font-serif); }
.sheet-body { padding: 4px 24px 24px; display: flex; flex-direction: column; }
.sheet section { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sheet section:last-child { border-bottom: 0; }
.sheet h3 { margin: 0; font: 650 14.5px/1.3 var(--font-ui); }
.sheet .hint { margin: 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
.model-opts { display: flex; flex-direction: column; gap: 8px; }
.model-opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.model-opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 50%, var(--surface)); }
.model-opt input { margin-top: 4px; accent-color: var(--accent); }
.model-opt .nm { font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font: 650 10.5px/1 var(--font-ui); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.lamp { background: var(--lamp-soft); color: var(--lamp); }
.tag.plain { background: var(--surface-2); color: var(--muted); }
.model-opt .desc { grid-column: 2; color: var(--muted); font-size: 13px; }
.model-opt .facts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
.model-opt .facts .saved { color: var(--ok); font-weight: 600; }
.model-opt .act { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.opt-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--bg); font-size: 14px; outline: none; }
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field .lbl { font-weight: 600; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.shortcuts { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 13px; align-items: center; }
.shortcuts span:nth-child(even) { display: flex; gap: 4px; justify-content: flex-end; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; z-index: 100; box-shadow: var(--shadow-pop); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 2px 4px; }

.scrim { display: none; }
@media (max-width: 860px) {
  .app, .app.rail-off { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-105%); transition: transform .22s ease; box-shadow: var(--shadow-pop); padding-left: 10px !important; padding-right: 10px !important; }
  .app.nav-open .rail { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(30, 24, 14, .35); z-index: 30; }
  .menu-btn { display: grid; }
  #railClose { display: none; }
  .md { font-size: calc(16.5px * var(--tscale, 1)); }
  .jump { bottom: 158px; }
  .column { padding-left: 18px; padding-right: 18px; }
  .dock { padding-left: 14px; padding-right: 14px; }
  .welcome { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 560px) {
  .meter { display: none; }
  .pill .lbl-long { display: none; }
  .pill { padding: 0 8px; }
  .model-chip .label { max-width: 38vw; }
  .work .wbar { width: 64px; }
  .greet { flex-direction: column; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- additions: notices, source chips, footer meta ---------- */
.fineprint { display: flex; align-items: center; justify-content: center; gap: 6px; }
.fineprint .ic { color: var(--muted); }
.notices { display: flex; flex-direction: column; gap: 8px; }
.notices:empty { display: none; }
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.notice .ic { margin-top: 3px; color: var(--muted); }
.notice b { color: var(--ink); font-weight: 650; }
.notice.warn { background: var(--lamp-soft); border-color: color-mix(in srgb, var(--lamp) 35%, var(--line)); }
.notice.warn .ic { color: var(--lamp); }
.src .site { color: var(--muted); font-size: 11.5px; padding-left: 6px; border-left: 1px solid var(--line); white-space: nowrap; }
.msg-foot .meta { display: inline-flex; gap: 10px; }
.msg-foot .meta span + span::before { content: "·"; margin-right: 10px; color: var(--line-2); }

/* ---------- new: composer extras ---------- */
.composer { position: relative; }
.pill.plus { width: 32px; padding: 0; justify-content: center; border-color: var(--line); color: var(--ink-2); }
.pill.plus:hover { color: var(--accent); }
.menu.act { width: 330px; max-height: min(72vh, 600px); overflow-y: auto; }
.menu .menu-title.sep { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
.menu.act .ck { display: grid; place-items: center; color: var(--muted); }
.menu.act button:disabled { opacity: .45; cursor: default; }
.slashmenu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); max-height: min(46vh, 340px); overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 6px; z-index: 20; }
.slashmenu .sl { display: grid; grid-template-columns: 22px auto minmax(0, 1fr); gap: 0 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; }
.slashmenu .sl.on, .slashmenu .sl:hover { background: var(--surface-2); }
.slashmenu .mi { color: var(--muted); }
.slashmenu .c { font-size: 14px; white-space: nowrap; }
.slashmenu .c b { font-weight: 650; }
.slashmenu .c i { font-style: normal; color: var(--muted); }
.slashmenu .d { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 0; }
.att { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 5px 6px 5px 9px; }
.att .ai { color: var(--accent); display: grid; place-items: center; width: 18px; }
.att .an { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.att .an b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att .an i { font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.att.static { padding-right: 11px; background: var(--surface); }
.att.loading { opacity: .85; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--lamp); animation: spin .8s linear infinite; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn.tiny { width: 24px; height: 24px; border-radius: 7px; }
.att-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: min(90%, 620px); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tag-s { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.net-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 550; color: var(--lamp); background: var(--lamp-soft); }
#filesBtn { position: relative; }
#filesBtn .badge { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 700 9.5px/15px var(--font-ui); text-align: center; }
.dropzone { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); pointer-events: none; }
.dropzone > div { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 38px 56px; border: 2px dashed var(--accent); border-radius: 24px; background: var(--surface); color: var(--accent); text-align: center; }
.dropzone b { font: 600 18px var(--font-ui); color: var(--ink); }
.dropzone span:last-child { color: var(--muted); font-size: 13px; }

/* ---------- new: messages ---------- */
.sum-divider { margin: 18px 0; color: var(--muted); font-size: 12.5px; }
.sum-divider summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.sum-divider summary::-webkit-details-marker { display: none; }
.sum-divider .line { flex: 1; height: 1px; background: var(--line); }
.sum-divider .lbl { display: inline-flex; align-items: center; gap: 6px; }
.sum-divider p { margin: 10px 0 0; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink-2); line-height: 1.55; }
.src.live .n { background: var(--lamp-soft); color: var(--lamp); }
.widget-slot:empty { display: none; }
.cb-acts { display: flex; align-items: center; gap: 2px; }
.cb-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--muted); font: 600 12px var(--font-ui); padding: 4px 8px; border-radius: 7px; }
.cb-btn:hover, .cb-btn.on { background: var(--surface-2); color: var(--ink); }
.cb-btn.on { color: var(--accent); }
.cb-head .icon-btn { width: 26px; height: 26px; }
.cb-out { border-top: 1px solid var(--line); background: var(--surface); }
.cb-out.frame iframe { display: block; width: 100%; height: 320px; border: 0; background: #fff; resize: vertical; }
.cb-out-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px 4px 12px; color: var(--muted); font: 12px var(--font-ui); border-top: 1px solid var(--line); }
.run-h { padding: 6px 12px 0; color: var(--muted); font: 600 11.5px var(--font-ui); }
.run-log { margin: 0; padding: 6px 12px 10px; font: 12.5px/1.55 var(--font-mono); max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.run-log .l.error { color: var(--danger); } .run-log .l.warn { color: var(--lamp); } .run-log .l.muted { color: var(--muted); }
.diagram { padding: 14px; overflow-x: auto; text-align: center; background: var(--surface); }
.diagram svg { max-width: 100%; height: auto; }
.muted { color: var(--muted); font: 13px var(--font-ui); }

/* ---------- new: study widgets ---------- */
.widget { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 16px 18px 14px; font-family: var(--font-ui); outline: none; box-shadow: var(--shadow-card); }
.widget .w-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.widget .w-head b { font-size: 15px; }
.widget .w-ico { color: var(--accent); display: grid; }
.widget .w-sub { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.widget .w-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.widget .w-actions .grow, .grow { flex: 1; }
.qz-dots { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.qz-dots .dot-q { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--muted); font: 600 12px var(--font-ui); padding: 0; }
.qz-dots .dot-q.cur { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qz-dots .dot-q.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.qz-dots .dot-q.bad { background: var(--danger); border-color: var(--danger); color: #fff; }
.qz-q { font: 500 18px/1.45 var(--font-serif); margin-bottom: 14px; }
.qz-choices { display: flex; flex-direction: column; gap: 8px; }
.qz-c { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line-2); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.4; }
.qz-c:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.qz-c .let { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: 650 12px var(--font-ui); color: var(--ink-2); }
.qz-c:disabled { cursor: default; color: var(--ink); }
.qz-c.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.qz-c.ok .let { background: var(--ok); color: #fff; }
.qz-c.bad { border-color: var(--danger); background: var(--danger-soft); }
.qz-c.bad .let { background: var(--danger); color: #fff; }
.qz-c.dim { opacity: .55; }
.qz-why { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; background: var(--surface-2); }
.qz-why.ok b { color: var(--ok); } .qz-why.bad b { color: var(--danger); }
.qz-result { text-align: center; padding: 8px 0 4px; }
.qz-result .big { font: 500 38px/1.1 var(--font-serif); color: var(--accent); }
.qz-result .msg { color: var(--ink-2); margin-top: 4px; }
.qz-missed-h { margin: 14px 0 6px; font-weight: 650; font-size: 13.5px; }
.qz-missed { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
.qz-missed .ans { color: var(--ok); margin-top: 2px; } .qz-missed .why { color: var(--muted); }
.widget .bar { margin-bottom: 14px; }
.fc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 190px; padding: 22px 24px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--bg); text-align: center; transition: background .15s, border-color .15s; }
.fc:hover { border-color: var(--accent); }
.fc.back { background: var(--accent-soft); border-color: var(--accent); }
.fc-side { font: 650 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fc-text { font: 500 20px/1.4 var(--font-serif); overflow-wrap: anywhere; }
.fc-hint { font-size: 12px; color: var(--muted); min-height: 1em; }
.slide { aspect-ratio: 16 / 9; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); padding: clamp(18px, 4vw, 36px) clamp(20px, 5vw, 44px); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.slide h3 { margin: 0 0 .55em; font: 600 clamp(20px, 3.2vw, 30px)/1.2 var(--font-serif); color: var(--accent); }
.slide ul { margin: 0; padding-left: 1.2em; font: clamp(14px, 2vw, 19px)/1.5 var(--font-ui); }
.slide li { margin: .35em 0; } .slide li::marker { color: var(--lamp); }
.slide.cover h3 { font-size: clamp(26px, 4.6vw, 44px); color: var(--ink); }
.slide.cover .sub { margin: 0; color: var(--muted); font-size: clamp(14px, 2vw, 20px); }
.sl-notes { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); }
.rot-l { transform: rotate(90deg); } .rot-r { transform: rotate(-90deg); }
.present { position: fixed; inset: 0; z-index: 120; background: #15140f; color: #f4f0e6; display: flex; flex-direction: column; outline: none; }
.p-stage { flex: 1; display: grid; place-items: center; padding: 3vw; cursor: pointer; min-height: 0; }
.slide.big { width: min(94vw, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; background: #1f1e18; border-color: #34322a; padding: 5vw; }
.slide.big h3 { font-size: clamp(28px, 4.4vw, 62px); color: #8fd0c6; }
.slide.big ul { font-size: clamp(18px, 2.6vw, 38px); }
.slide.big.cover h3 { color: #f4f0e6; font-size: clamp(34px, 6vw, 84px); }
.slide.big .sub { color: #b9b3a3; font-size: clamp(18px, 2.6vw, 36px); }
.p-bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px)); color: #b9b3a3; font-size: 13px; }
.p-bar .btn { background: transparent; color: #f4f0e6; border-color: #4a463c; }

/* ---------- new: dialogs, palette, settings ---------- */
dialog.sheet.wide { width: min(860px, calc(100vw - 32px)); }
dialog.sheet.small { width: min(440px, calc(100vw - 32px)); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.btn.danger-fill, .btn.primary.danger-fill { background: var(--danger); border-color: var(--danger); color: #fff; }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--ink-2); }
.check input { margin-top: 3px; accent-color: var(--accent); }
#askInput { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: var(--bg); font-size: 15px; outline: none; }
#askInput:focus { border-color: var(--accent); }
.viewer-frame { width: 100%; height: min(70vh, 640px); border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.help h3, .readbox h3 { margin: 18px 0 6px; font: 650 14px var(--font-ui); }
.help h3:first-child, .readbox h3:first-of-type { margin-top: 4px; }
.help p, .readbox p, .readsum { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.help-cmds { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; align-items: baseline; }
.help-cmds code { font: 600 12.5px var(--font-mono); color: var(--accent); }
.help-cmds span { color: var(--ink-2); }
.readbox ul, .readbox ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
.readnotes { margin: 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 46vh; overflow: auto; }
dialog.palette { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); width: min(620px, calc(100vw - 24px)); box-shadow: var(--shadow-pop); margin: 12vh auto auto; overflow: hidden; }
dialog.palette::backdrop { background: rgba(30, 24, 14, .38); }
.pal-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.pal-top input { flex: 1; border: 0; background: transparent; font-size: 17px; outline: none; color: var(--ink); }
.pal-list { max-height: min(52vh, 440px); overflow-y: auto; padding: 6px; }
.pal-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; }
.pal-row.on { background: var(--surface-2); }
.pal-row .mi { color: var(--muted); }
.pal-row .pt { display: flex; flex-direction: column; min-width: 0; }
.pal-row .pt b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-row .pt i { font-style: normal; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-row .kind { font-size: 11.5px; color: var(--muted); }
.pal-foot { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.pal-foot kbd { margin-right: 3px; }
.switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:disabled { cursor: default; } .switch input:disabled + span { opacity: .5; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.src-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.src-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.src-row:last-child { border-bottom: 0; }
.src-row .dot { margin-top: 6px; }
.sr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
.sr-main b { font-size: 14px; }
.sr-what { color: var(--ink-2); } .sr-sends, .sr-state { color: var(--muted); font-size: 12.5px; }
.sheet h4 { margin: 8px 0 0; font: 650 13.5px var(--font-ui); }
.mem-list { display: flex; flex-direction: column; gap: 6px; }
.mem-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 11px; padding: 6px 6px 6px 12px; font-size: 14px; }
.grow-row input { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--bg); font-size: 14px; outline: none; }
.grow-row input:focus { border-color: var(--accent); }
.priv { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pv-row { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pv-row:last-child { border-bottom: 0; } .pv-row span { color: var(--muted); }
#voiceSel { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--bg); max-width: 100%; font-size: 13px; }
@media (max-width: 560px) {
  .pv-row { grid-template-columns: 1fr; gap: 2px; }
  .slashmenu .d { display: none; }
  .att .an i { display: none; }
  .menu.act { width: min(330px, calc(100vw - 16px)); }
}
@media print {
  .rail, .topbar, .dock, .jump, .toast, .msg-foot, .row-acts, dialog { display: none !important; }
  body, .app, .main, .thread { overflow: visible !important; height: auto !important; display: block !important; }
  .app { grid-template-columns: 1fr !important; }
}

/* small phones: keep the send button on the same row as the pills */
@media (max-width: 560px) {
  .c-bar { flex-wrap: nowrap; gap: 5px; padding: 6px 8px 8px 8px; }
  #styleBtn { width: 32px; padding: 0; justify-content: center; }
  #styleBtn span, #styleBtn .chev { display: none; }
  #roleBtn { width: 32px; padding: 0; justify-content: center; }
  #roleBtn span, #roleBtn .chev { display: none; }
  .c-bar .pill { flex: 0 1 auto; min-width: 0; }
  .fineprint { font-size: 11px; line-height: 1.35; }
  .fineprint .ic { display: none; }
}

/* ----- learning ----- */
.learned-btn { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 5px 10px; border-radius: 8px; }
.learned-btn:hover { color: var(--accent); background: var(--hover); }
.learned-btn .ic { color: var(--lamp); }
.chips button.sug { border-style: dashed; }
.lrn-switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.lrn-switch:first-of-type { border-top: 0; }
.lrn-switch .lt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lrn-switch .lt b { font-weight: 600; font-size: 14px; }
.lrn-switch .lt span { color: var(--muted); font-size: 13px; line-height: 1.45; }
.mem-item .mt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mem-tag { font-style: normal; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.learned h3 { font-size: 15px; margin: 18px 0 6px; }
.learned h3:first-child { margin-top: 0; }
.learned .fine { margin-top: 18px; font-size: 12.5px; }
.lrn-list { margin: 6px 0 8px; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.lrn-list li i { font-style: normal; color: var(--muted); font-size: 12px; }
.lrn-list a { color: var(--accent); text-decoration: none; }
.lrn-list a:hover { text-decoration: underline; }
.lrn-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.lrn-x { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; text-decoration: underline; padding: 0 4px; cursor: pointer; }
.lrn-x:hover { color: var(--accent); }
.notice .nt .alt { margin: 2px 4px 2px 0; }
.lrn-tag { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2); background: var(--surface); }

.stall-hint { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--lamp-soft); border: 1px solid color-mix(in srgb, var(--lamp) 35%, var(--line)); color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }

/* confidence label under an answer */
.conf { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; margin-left: 6px; }
.conf:hover { border-color: var(--line-2); color: var(--ink-2); }
.conf .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.conf-high .dot { background: var(--ok); }
.conf-medium .dot { background: var(--lamp); }
.conf-low .dot { background: var(--danger); }
.conf-why { flex-basis: 100%; font-size: 12.5px; color: var(--ink-2); padding: 4px 8px 2px 8px; }
.conf-why[hidden] { display: none; }

/* battery saver badge, fact check panel, both-sides notice */
.saver-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--lamp-soft); color: var(--lamp); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.saver-badge[hidden] { display: none; }
.saver-badge:hover { border-color: var(--lamp); }
.fc-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fc-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.fc-mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.fc-supported .fc-mark { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.fc-unconfirmed .fc-mark { background: var(--lamp-soft); color: var(--lamp); }
.fc-contradicted .fc-mark { background: var(--danger-soft); color: var(--danger); }
.fc-claim { font-size: 14.5px; line-height: 1.45; }
.fc-meta { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.fc-meta b { color: var(--ink-2); }
.fc-btn { margin-left: 2px; }

/* essay form and daily review */
.essay-form label { display: block; font-weight: 600; font-size: 13.5px; margin: 14px 0 6px; color: var(--ink-2); }
.essay-form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 10px 12px; font: inherit; line-height: 1.5; resize: vertical; }
.essay-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.review .bar { margin: 8px 0 14px; }
.review .w-actions { margin-top: 12px; }
.review .w-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.review .w-sub { color: var(--muted); font-size: 12.5px; }
.review .w-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.review .fc { margin-top: 2px; }

/* versions of an edited or repeated message */
.fork-row { display: flex; justify-content: flex-end; margin-top: 2px; }
.fork-nav { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.fork-b { width: 24px; height: 24px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.fork-b:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.fork-b:disabled { opacity: .35; cursor: default; }
.fork-n { min-width: 30px; text-align: center; }

/* prompt versions and example answers (settings) */
.pv-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.pv-row input { margin-top: 4px; accent-color: var(--accent); }
.pv-row .lt { display: flex; flex-direction: column; gap: 2px; }
.pv-row .lt span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.ex-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ex-item { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.ex-item summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; list-style: none; }
.ex-item summary::-webkit-details-marker { display: none; }
.ex-q { font-weight: 600; font-size: 14px; }
.ex-tag { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.ex-item input, .ex-item textarea { width: 100%; margin-top: 8px; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.ex-item .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* Test lab */
.lab { display: flex; flex-direction: column; gap: 14px; }
.lab-sec { border-top: 1px solid var(--line); padding-top: 12px; }
.lab-sec h3 { margin: 0 0 6px; font-size: 16px; }
.lab .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.lab select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
.lab .hint.inline { margin: 0; }
.lab .hint.warn { color: var(--lamp); }
.lab-chk { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; font-size: 14px; }
.lab-chk i { color: var(--muted); font-style: normal; }
.lab-chk input { margin-top: 3px; accent-color: var(--accent); }
.lab-tbl { overflow-x: auto; margin: 8px 0; }
.lab-tbl table { border-collapse: collapse; font-size: 13px; min-width: 100%; font-variant-numeric: tabular-nums; }
.lab-tbl th, .lab-tbl td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lab-tbl th { color: var(--muted); font-weight: 600; }
.lab-result { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, var(--bg)); font-size: 14px; line-height: 1.5; }
.lab-result.good { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.lab-result.bad { border-color: color-mix(in srgb, var(--lamp) 45%, var(--line)); background: var(--lamp-soft); }
.lab-result small { color: var(--muted); }
.lab-live { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; position: sticky; top: 0; z-index: 2; }
.lab-live[hidden] { display: none; }
.lb-p { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; min-width: 80px; }
.lb-p b { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.lab-bar { position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 60; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 6px 24px rgba(0,0,0,.14); font-size: 13.5px; max-width: calc(100vw - 24px); }
.lab-bar[hidden] { display: none; }
.lab-other summary { cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 6px 0; }
.lab-ans { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lab-ans .q { color: var(--muted); margin: 2px 0; }
.lab-ans .a { white-space: pre-wrap; }
.lab-ans.bad b { color: var(--lamp); }
@media print { .lab-bar { display: none !important; } }

.lab .lab-sub { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 14px 0 2px; color: var(--ink); }

/* dictation */
.mic { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); display: grid; place-items: center; flex: none; transition: background .15s, color .15s, opacity .15s; }
.mic:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.mic:disabled { opacity: .4; cursor: default; }
.mic.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: micpulse 1.6s ease-in-out infinite; }
.mic.on.online { background: var(--lamp); border-color: var(--lamp); color: #fff; }
@keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.dict { display: flex; flex-direction: column; gap: 10px; }
.dict-state, .dict-warn { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.dict-state.ok { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.dict-state.warn, .dict-warn { background: var(--lamp-soft); border-color: color-mix(in srgb, var(--lamp) 45%, var(--line)); }
.dict-state .ic, .dict-warn .ic { flex: none; margin-top: 2px; }
.dict-warn p { margin: 4px 0 0; }
.ic-w { display: inline-flex; flex: none; }
.dict-note { display: flex; gap: 7px; align-items: flex-start; margin: 2px 4px 6px; padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.dict-note[hidden] { display: none; }
.dict-note.online { background: var(--lamp-soft); color: var(--ink); font-weight: 600; }
.dict-note .ic-w { margin-top: 2px; }

/* ---------- offline Wikipedia ---------- */
.wp { display: flex; flex-direction: column; gap: 10px; }
.wp-prog .bar { margin-top: 2px; }
.wp-try { display: flex; flex-direction: column; gap: 6px; }
.wp-hit { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
.wp-hit span { color: var(--muted); }
.wp-how { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.wp-how summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.wp-how ol { margin: 8px 0 6px 18px; padding: 0; font-size: 14px; line-height: 1.55; }
.wp-how code { font: 12.5px/1.4 ui-monospace, Menlo, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-word; }
.hint.warn { color: var(--ink); }

@media (pointer: coarse) { .seg button { min-height: 38px; } .sheet .btn { min-height: 38px; } }

/* ---------- legal pages, footer links, AI note ---------- */
.legal-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; max-width: 760px; margin: 2px auto 0; font-size: 11.5px; }
.legal-links a { color: var(--muted); text-decoration: none; padding: 3px 0; }
.legal-links a:hover, .legal-links a:focus-visible { color: var(--accent); text-decoration: underline; }
.ai-note { max-width: 560px; margin: 14px auto 0; text-align: center; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.ai-note b { color: var(--ink-2, var(--ink)); font-weight: 600; }
.ai-note a { color: var(--muted); }
.main:not(.is-empty) .ai-note { display: none; }
dialog.legal .lg-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 24px 0; background: var(--surface); }
dialog.legal .lg-tab { border: 1px solid var(--line-2); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; min-height: 32px; }
dialog.legal .lg-tab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
dialog.legal[open] { display: flex; flex-direction: column; overflow: hidden; }
dialog.legal .sheet-head, dialog.legal .lg-tabs { flex: none; }
dialog.legal .sheet-body { gap: 4px; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 8px; }
dialog.legal .sheet-body h4 { margin: 18px 0 2px; }
dialog.legal .hint.lg { font-size: 14px; line-height: 1.6; max-width: 66ch; margin: 4px 0; color: var(--ink); }
dialog.legal .lg-list { margin: 4px 0; padding-left: 20px; font-size: 14px; line-height: 1.6; max-width: 66ch; }
dialog.legal .lg-list li { margin: 5px 0; }
dialog.legal .priv { margin: 6px 0; }
dialog.legal .row { display: flex; gap: 8px; margin: 6px 0; }
@media (max-width: 640px) { dialog.legal .lg-tabs { padding: 10px 16px 0; } .legal-links { font-size: 11px; gap: 0 12px; } }
@media (pointer: coarse) { dialog.legal .lg-tab { min-height: 38px; } .legal-links a { padding: 8px 0; } }

/* ---- Settings: a menu on the left, one page at a time (on a phone: a list first, then the page) ---- */
dialog.sheet.settings { width: min(940px, calc(100vw - 32px)); height: min(84vh, 720px); max-height: none; overflow: hidden; }
dialog.sheet.settings[open] { display: flex; flex-direction: column; }
dialog.sheet.settings .sheet-head { position: static; flex: none; justify-content: flex-start; gap: 6px; }
dialog.sheet.settings .sheet-head h2 { flex: 1; }
.set-shell { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.set-nav { overflow-y: auto; padding: 10px; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.set-tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); text-align: left; font-size: 14px; }
.set-tab .nt { display: flex; flex-direction: column; min-width: 0; flex: 1; }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function iconButton(name, label, onclick, cls = 'icon-btn') {
  return h('button', { class: cls, type: 'button', 'aria-label': label, title: label, html: icon(name, 17), onclick });
}
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = h('textarea', { style: 'position:fixed;opacity:0;top:0;left:0' }); ta.value = text; document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch {} ta.remove();
  }
  if (btn) { const old = btn.innerHTML; btn.innerHTML = icon(ok ? 'check' : 'x', 17); setTimeout(() => (btn.innerHTML = old), 1300); }
  if (!ok) toast('Could not copy. Select the text and copy it by hand.');
}
function downloadFile(name, text, type = 'text/markdown') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- chat storage (IndexedDB, with a memory fallback) ---------- */
const Store = {
  db: null, mem: new Map(),
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('lumen-chats', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('chats', { keyPath: 'id' });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch { this.db = null; }
  },
  store(mode) { return this.db.transaction('chats', mode).objectStore('chats'); },
  async all() {
    if (!this.db) return [...this.mem.values()];
    return new Promise(res => { try { const r = this.store('readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch { res([]); } });
  },
  async put(chat) {
    if (erasing) return;
    const clean = JSON.parse(JSON.stringify(chat, (k, v) => (k.startsWith('_') ? undefined : v)));
    this.mem.set(chat.id, clean);
    if (!this.db) return;
    return new Promise(res => { try { const r = this.store('readwrite').put(clean); r.onsuccess = r.onerror = () => res(); } catch { res(); } });
  },
  async del(id) {
    this.mem.delete(id);
    if (!this.db) return;
    return new Promise(res => { try { const r = this.store('readwrite').delete(id); r.onsuccess = r.onerror = () => res(); } catch { res(); } });
  },
};
/* Save a chat only if it still exists (it may have been deleted while Lumen was answering). */
function saveChat(chat) { if (App.chats.includes(chat)) return Store.put(chat); }

/* ---------- network helper: timeouts, a small saved cache, and source health ---------- */
/* Everything Lumen looks up goes through here. A source that keeps failing is paused for a few minutes
   (so one broken site never slows an answer), and answers seen before are kept so repeat questions are instant,
   and still work when the internet is gone. */
const Cache = {
  db: null, mem: new Map(), ready: null,
  open() {
    return this.ready ||= (async () => {
      try {
        this.db = await new Promise((res, rej) => {
          const r = indexedDB.open('lumen-cache', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        });
      } catch { this.db = null; }
    })();
  },
  async get(key) {
    const m = this.mem.get(key); if (m) return m;
    await this.open(); if (!this.db) return null;
    return new Promise(res => {
      try {
        const r = this.db.transaction('kv').objectStore('kv').get(key);
        r.onsuccess = () => { const e = r.result; if (e) this.mem.set(key, e); res(e || null); };
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  async set(key, v) {
    if (erasing) return;
    const e = { v, t: Date.now() };
    this.mem.set(key, e);
    if (this.mem.size > 300) this.mem.delete(this.mem.keys().next().value);
    await this.open(); if (!this.db) return;
    try { this.db.transaction('kv', 'readwrite').objectStore('kv').put(e, key); } catch {}
  },
  async clear() {
    this.mem.clear(); await this.open(); if (!this.db) return;
    await new Promise(res => { try { const r = this.db.transaction('kv', 'readwrite').objectStore('kv').clear(); r.onsuccess = r.onerror = () => res(); } catch { res(); } });
  },
  async count() {
    await this.open(); if (!this.db) return this.mem.size;
    return new Promise(res => { try { const r = this.db.transaction('kv').objectStore('kv').count(); r.onsuccess = () => res(r.result); r.onerror = () => res(0); } catch { res(0); } });
  },
  /* Forget entries older than a week, and keep at most 500. */
  async prune(maxAge = 7 * 864e5, maxEntries = 500) {
    await this.open(); if (!this.db) return;
    try {
      const store = this.db.transaction('kv', 'readwrite').objectStore('kv');
      const rows = [];
      await new Promise(res => {
        const cur = store.openCursor();
        cur.onsuccess = () => { const c = cur.result; if (!c) return res(); rows.push({ k: c.key, t: c.value?.t || 0 }); c.continue(); };
        cur.onerror = () => res();
      });
      rows.sort((a, b) => b.t - a.t);
      rows.forEach((r, i) => { if (Date.now() - r.t > maxAge || i >= maxEntries) { try { store.delete(r.k); } catch {} } });
    } catch {}
  },
};
