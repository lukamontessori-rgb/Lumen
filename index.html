        u.onend = () => { if (i === parts.length - 1 && this.id === id) this.stop(); };
        u.onerror = () => { if (this.id === id) this.stop(); };
        speechSynthesis.speak(u);
      });
    }, 60);
  },
};
function plainText(md) {
  return cleanAnswer(md || '')
    .replace(/```[\s\S]*?```/g, ' (a code block) ')
    .replace(/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]/g, ' (a formula) ').replace(/\$[^$\n]+\$/g, ' (a formula) ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\[\d{1,2}\]/g, '').replace(/`([^`]+)`/g, '$1')
    .replace(/^\s*\|?[-: |]+\|?\s*$/gm, '').replace(/\|/g, ', ')
    .replace(/^#{1,6}\s*/gm, '').replace(/^\s*[-*+]\s+/gm, '').replace(/^\s*>\s?/gm, '').replace(/[*_~]{1,3}/g, '')
    .replace(/\s*\n{2,}\s*/g, '.\n').replace(/\s*\n\s*/g, ' ').replace(/\.\./g, '.').trim();
}
function speechChunks(text) {
  const out = []; let cur = '';

  }
  if (cur) out.push(cur);
  return out.flatMap(c => c.length > 300 ? c.match(/.{1,260}(?:\s|$)/g) : [c]).map(c => c.trim()).filter(Boolean);

/* ---------- Dictation: speak instead of type ----------
   Off until the person turns it on in Settings. The words land in the message box, where they can be fixed. Nothing is sent until Send is pressed.
   Private mode: the browser turns speech into text on this computer (no internet needed). Lumen only starts it when the browser says the language is installed.
   Online mode: the browser sends the voice to its own speech service (Chrome: Google). Lumen never gets the audio. It needs a clear yes in Settings. */
const Dictation = (() => {
  const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
  const canLocal = !!(SR && typeof SR.available === 'function');
  const cfg = () => S.dictation;
  const lang = () => (cfg().lang === 'en-GB' ? 'en-GB' : 'en-US');
  const micEl = () => document.getElementById('micBtn');
  let rec = null, listening = false, starting = false, base = '', idle = 0, grace = 0, idleMs = 25000;
  const enabled = () => !!(SR && cfg().on && cfg().mode);
  const isLocal = () => cfg().mode === 'local';

  /* 'available' (installed on this computer), 'downloadable', 'downloading', 'unavailable', or 'none' (this browser cannot check). */
  async function localState() {
    if (!canLocal) return 'none';
    try { return await Promise.race([SR.available({ langs: [lang()], processLocally: true }), new Promise(res => setTimeout(() => res('unavailable'), 4000))]); } catch { return 'unavailable'; }   // a browser that never answers counts as "not available"
  }
  async function install() {
    if (!canLocal || typeof SR.install !== 'function') return false;
    try { return !!(await SR.install({ langs: [lang()], processLocally: true })); } catch { return false; }
  }
  function turnOn(mode) { cfg().on = true; cfg().mode = mode === 'local' ? 'local' : 'online'; saveSettings(); sync(); }
  function turnOff() { abort(); cfg().on = false; saveSettings(); sync(); }

  /* The microphone button: only on the page when dictation is on. */
  function sync() {
    const b = micEl(); if (!b) return;
    const on = enabled();
    b.hidden = !on;
    if (!on) { if (rec) abort(); return; }
    const blocked = !!App.run || Lab.isBusy() || Brain.state === 'unsupported';
    if (blocked && rec) abort();
    b.disabled = blocked;
    b.classList.toggle('on', listening);
    b.classList.toggle('online', !isLocal());
    b.setAttribute('aria-pressed', String(listening));
    if (!b.firstChild) b.innerHTML = icon('mic', 18);
    b.setAttribute('aria-label', listening ? 'Stop dictation' : 'Dictate: speak instead of type');
    b.title = listening ? 'Stop (Esc)' : isLocal() ? 'Dictate. Private: your voice stays on this computer.' : 'Dictate. Online: your voice goes to the browser’s speech service.';
  }
  /* A line inside the composer while the microphone is on, so it is always clear where the voice goes. */
  function fine(on) {
    const n = document.getElementById('dictNote'); if (!n) return;
    n.hidden = !on;
    n.classList.toggle('online', on && !isLocal());
    if (on) n.innerHTML = `<span class="ic-w">${icon(isLocal() ? 'lock' : 'alert', 14)}</span><span>${isLocal() ? 'Listening. Your voice stays on this computer. ' : 'Listening. Your voice is being sent to the browser’s online speech service, so this part is not private. '}Press the microphone or Esc to stop. Nothing is sent to Lumen until you press Send.</span>`;
    else n.replaceChildren();
  }

  const MSG = {
    'not-allowed': 'The microphone is blocked. Click the icon next to the address, allow the microphone for this page, and try again.',
    'service-not-allowed': 'This browser does not allow dictation here.',
    'audio-capture': 'No microphone was found. Check that one is connected.',
    'network': 'Online dictation could not reach the browser’s speech service. Check your internet connection.',
    'language-not-supported': 'That language is not installed for private dictation. Open Settings, then Dictation.',
    'no-speech': 'I did not hear anything. Try again, a little closer to the microphone.',
  };
  function put(text) {
    const v = base + String(text || '').replace(/^\s+/, '');
    els.input.value = v;
    try { els.input.setSelectionRange(v.length, v.length); } catch {}
    els.input.dispatchEvent(new Event('input', { bubbles: true }));
  }
  const bump = () => { clearTimeout(idle); idle = setTimeout(() => { if (rec) { stop(); toast('Dictation stopped because nothing was heard for a while.'); } }, idleMs); };
  /* The session is over. Whatever is in the box stays (it is the person's text now). */
  function done() {
    clearTimeout(idle); clearTimeout(grace);
    const r = rec; rec = null; listening = false; starting = false;
    if (r) { r.onresult = r.onerror = r.onend = r.onstart = null; }
    fine(false); sync();
  }
  /* Stop for good, right now (sending, typing, switching away). */
  function abort() {
    const r = rec; if (!r) { starting = false; return; }
    done();
    try { r.abort(); } catch { try { r.stop(); } catch {} }
  }
  /* Stop politely: the last words that were still being recognised can still arrive. */
  function stop() {
    const r = rec; if (!r) return;
    listening = false; clearTimeout(idle); sync();
    try { r.stop(); } catch {}
    grace = setTimeout(() => { if (rec === r) abort(); }, 1500);
  }
  async function start() {
    if (rec) abort();
    if (starting || !enabled() || App.run) return;
    starting = true;
    try {
      if (isLocal()) {
        const st = await localState();
        if (st !== 'available') { toast(st === 'downloadable' || st === 'downloading' ? 'The private dictation language pack is not on this computer yet. Open Settings, then Dictation, to download it.' : 'Private dictation is not available in this browser any more. Open Settings, then Dictation.'); return; }
      } else if (navigator.onLine === false) { toast('Online dictation needs the internet, and you are offline.'); return; }
      const r = new SR();
      r.lang = lang(); r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
      if (isLocal()) {
        r.processLocally = true;
        if (r.processLocally !== true) { toast('This browser did not accept private dictation, so Lumen did not start listening.'); return; }   // never fall back to the online service by accident
      }
      Speech.stop();   // the microphone must not hear the read-aloud voice
      base = els.input.value; if (base && !/\s$/.test(base)) base += ' ';
      r.onresult = e => {
        if (r !== rec) return;
        let text = '';
        for (let i = 0; i < e.results.length; i++) text += e.results[i][0]?.transcript || '';
        put(text); bump();
      };
      r.onerror = e => { if (r !== rec) return; const m = MSG[e.error]; done(); if (m) toast(m); else if (e.error && e.error !== 'aborted') toast('Dictation stopped (' + e.error + ').'); };
      r.onend = () => { if (r === rec) done(); };
      rec = r;
      try { r.start(); } catch (e) { rec = null; toast('Dictation could not start. Try again in a moment.'); return; }
      listening = true; fine(true); bump(); sync(); els.input.focus();
    } finally { starting = false; }
  }
  const toggle = () => { if (listening) stop(); else start(); };

  document.addEventListener('click', e => { const b = micEl(); if (b && b.contains(e.target)) { e.preventDefault(); toggle(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && rec) { e.preventDefault(); e.stopPropagation(); stop(); } }, true);
  els.input.addEventListener('keydown', e => { if (rec && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Enter')) abort(); });   // typing takes over from the microphone
  document.addEventListener('visibilitychange', () => { if (document.hidden && rec) abort(); });
  window.addEventListener('pagehide', () => { if (rec) abort(); });

  return { supported: !!SR, canLocal, localState, install, turnOn, turnOff, enabled, start, stop, abort, toggle, sync, active: () => !!rec, isListening: () => listening, setIdle: ms => { idleMs = ms; } };
})();

/* ---------- model status (top chip, rail, welcome banner) ---------- */
function modelStatus() {
  const m = Brain.model(S.model);
  switch (Brain.state) {
    case 'checking': return { dot: '', text: 'Checking your browser…', name: m.name };
    case 'unsupported': return { dot: 'error', text: 'Not supported here', name: m.name };
    case 'loading': { const lm = Brain.model(Brain.loadingKey || S.model); return { dot: 'busy', text: `${Brain.phase || 'Starting'} · ${Math.round(Brain.progress * 100)}%`, name: lm.name }; }
    case 'ready': return { dot: 'ready', text: 'Ready on this computer', name: Brain.model(Brain.loadedKey).name };
    case 'error': return { dot: 'error', text: 'Could not start', name: m.name };
    default: return { dot: '', text: Brain.cached[S.model] ? 'Saved · not started' : 'Not downloaded yet', name: m.name };
  }
}

function renderBrainCard() {

  card.hidden = Brain.state === 'ready';
  const changeBtn = h('button', { class: 'btn ghost', type: 'button', text: 'Change model', onclick: () => openSettings('models') });

    case 'checking':

      break;
    case 'unsupported':
      card.classList.add('warn');
      card.append(h('div', { class: 'bi' }, h('h3', { text: 'This browser can’t run the AI model' }), h('p', { text: Brain.unsupportedWhy }),
        h('p', { text: 'Open this page in Google Chrome (version 113 or newer). Safari works on macOS 26 (Tahoe) or newer.' })));
      break;
    case 'loading': {
      const pct = Math.round(Brain.progress * 100);

        const rate = Brain.mb / Brain.elapsed; const left = Math.max(0, (lm.downloadMB - Brain.mb) / rate);
        eta = `${fmtMB(Brain.mb)} of ${fmtMB(lm.downloadMB)} · about ${fmtSecs(left)} left`;

        h('h3', { text: `${Brain.phase || 'Starting'}: ${lm.name}` }),
        h('p', { text: Brain.phase === 'Downloading' ? 'This happens only once. You can type your question now; Lumen answers as soon as it is ready.' : 'Starting the model on your graphics chip.' }),
        h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct) }, h('i', { style: `width:${pct}%` })),
        h('div', { class: 'progress-meta' }, h('span', { text: `${pct}%` }), h('span', { text: eta }))));
      if (Brain.otherTab || Brain.stalled) {
        const hint = Brain.otherTab ? 'Lumen is also open in another tab or window. Close the other one, then reload this page. Two copies cannot both start the model on one computer.'

        card.firstChild.append(h('p', { class: 'stall-hint', role: 'status', text: hint }));
      }
      break;
    }
    case 'error':
      card.classList.add('warn');
      card.append(h('div', { class: 'bi' }, h('h3', { text: 'The model could not start' }), h('p', { text: Brain.error })),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', text: 'Try again', onclick: () => Brain.load(S.model).catch(() => {}) }),
          Brain.stuck && Brain.wasCached ? armedButton('Delete the saved model and start over', 'Click again to delete and download', async () => { await Brain.remove(S.model); Brain.load(S.model).catch(() => {}); }) : null,
          changeBtn));
      break;
    case 'idle': {
      const saved = Brain.cached[S.model];
      card.append(h('div', { class: 'bi' },
        h('h3', { text: saved ? `${m.name} is saved in this browser` : `Download ${m.name} to start` }),
        h('p', { text: saved ? 'Start it to begin. It runs on your graphics chip and works without internet.'

        h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', html: `${icon(saved ? 'bolt' : 'download', 15)}<span>${saved ? 'Start' : 'Download'}</span>`, onclick: () => Brain.load(S.model).catch(() => {}) }), changeBtn));
    }
  }
}

/* ----- "Delete all my data" ----- */
const idbDelete = name => new Promise(res => { try { const q = indexedDB.deleteDatabase(name); q.onsuccess = q.onerror = q.onblocked = () => res(); } catch { res(); } setTimeout(res, 1500); });
async function eraseEverything() {
  erasing = true;   // from now on nothing is saved again, so nothing comes back before the page restarts
  try { stopRun(); } catch {}
  try { WikiPack.cancel(); } catch {}
  try { await Promise.race([Brain.teardown(), new Promise(r => setTimeout(r, 3000))]); } catch {}
  // empty the stores first (so the data is gone even if the browser is slow to remove a database)
  try { for (const c of [...App.chats]) await Store.del(c.id); App.chats = []; } catch {}
  try { await Cache.clear(); } catch {}
  try { await Learn.forgetLibrary(); } catch {}
  try { await WikiPack.remove(); } catch {}
  try { Store.db?.close(); Cache.db?.close(); } catch {}
  try { localStorage.clear(); sessionStorage.clear(); } catch {}
  // the AI model files, the page copy and every other database of this site
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try {
    const names = new Set(['lumen-chats', 'lumen-cache', 'lumen-kb', 'lumen-wikipack']);
    if (indexedDB.databases) for (const d of await indexedDB.databases()) if (d?.name) names.add(d.name);
    await Promise.all([...names].map(idbDelete));
  } catch {}
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  location.replace(location.pathname);
}

}

/* ---------- export, import and printing ---------- */
function widgetToMarkdown(w) {
  if (w.type === 'quiz') return quizToMarkdown(w.data);
  if (w.type === 'cards') return cardsToMarkdown(w.data);
  if (w.type === 'slides') return `# ${w.data.title}\n\n` + w.data.slides.map(s => `## ${s.title}\n\n${s.bullets.map(b => '- ' + b).join('\n')}${s.notes ? `\n\n_${s.notes}_` : ''}`).join('\n\n') + '\n';
  return '';
}
function answerToMarkdown(m) {
  let out = (m.content || '') + '\n\n';
  if (m.widget) out += widgetToMarkdown(m.widget) + '\n';
  if (m.sources?.length) out += '**Sources**\n\n' + m.sources.map(s => `${s.n}. ${s.url ? `[${s.title}](${s.url})` : s.title} (${s.site || 'Wikipedia'})`).join('\n') + '\n' + (m.sources.some(s => /^Wikipedia\b/.test(s.site || 'Wikipedia')) ? '\n_Text from Wikipedia, available under CC BY-SA 4.0._\n' : '');
  return out;
}
function chatToMarkdown(c) {
  let out = `# ${c.title}\n\n_Saved from Lumen on ${new Date().toLocaleString('en-GB')}_\n\n`;
  if (c.docs?.length) out += `Files in this chat: ${c.docs.map(d => d.name).join(', ')}\n\n`;
  for (const m of c.messages) {
    if (m.role === 'user') out += `**You:**\n\n${m.content}\n\n`;
    else out += `**Lumen:**\n\n${m.content ? answerToMarkdown(m) : '_(no answer)_\n'}\n`;
  }
  return out + AI_FOOT_MD;
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('That file is not a Lumen backup.'); return; }
  const chats = Array.isArray(data) ? data : Array.isArray(data?.chats) ? data.chats : null;
  if (!chats) { toast('That file is not a Lumen backup.'); return; }
  let added = 0;
  for (const c of chats) {
    if (!c || typeof c.id !== 'string' || !Array.isArray(c.messages)) continue;
    const old = App.chats.find(x => x.id === c.id);
    if (old) { if ((c.updated || 0) <= (old.updated || 0)) continue; App.chats = App.chats.filter(x => x !== old); }
    c.title = String(c.title || 'Chat').slice(0, 120); c.updated = c.updated || Date.now(); c.created = c.created || c.updated;
    for (const m of c.messages) if (m.state === 'working') m.state = 'stopped';
    for (const f of Object.values(c.forks && typeof c.forks === 'object' ? c.forks : {})) for (const v of f?.versions || []) for (const m of v?.msgs || []) if (m.state === 'working') m.state = 'stopped';
    App.chats.push(c); await Store.put(c); added++;
  }
  if (Array.isArray(data?.settings?.memory)) {
    for (const m of data.settings.memory) {
      if (!m?.text || S.memory.some(x => x.text === m.text) || S.memory.length >= MEM_MAX) continue;
      const it = { id: uid(), text: String(m.text).slice(0, 200), added: Number.isFinite(m.added) ? m.added : Date.now() };
      if (m.src === 'auto') it.src = 'auto';
      if (typeof m.key === 'string') it.key = m.key.slice(0, 40);
      if (['alias', 'taught', 'pref'].includes(m.kind)) it.kind = m.kind;
      if (it.kind === 'alias' && typeof m.a === 'string' && typeof m.b === 'string') { it.a = m.a.slice(0, 60); it.b = m.b.slice(0, 60); } else if (it.kind === 'alias') delete it.kind;
      S.memory.push(it);
    }
    saveSettings();
  }
  if (data?.settings?.learn?.meant) Learn.importMeanings(data.settings.learn.meant);
  if (Array.isArray(data?.library)) await Learn.importKB(data.library);
  renderSidebar(); toast(added ? `Restored ${added} chat${added === 1 ? '' : 's'}.` : 'Nothing new to restore.');
}
